<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetflixScout — Mappa del progetto</title>
<style>
  :root {
    --bg: #1e1e1e;
    --sidebar: #181818;
    --activity: #181818;
    --border: #2b2b2b;
    --tab-bg: #181818;
    --tab-active: #1f1f1f;
    --text: #cccccc;
    --muted: #8b8b8b;
    --accent: #0078d4;
    --hover: #2a2d2e;
    --selected: #04395e;
    --git-m: #e2c08d;
    --git-u: #73c991;
    --ignored: #6e6e6e;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-rows: 30px 1fr 22px; height: 100vh; }
  .titlebar { background: #181818; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); position: relative; }
  .titlebar .dots { position: absolute; left: 12px; display: flex; gap: 8px; }
  .titlebar .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .workbench { display: grid; grid-template-columns: 48px var(--side-w, 280px) 4px 1fr; min-height: 0; }

  /* Activity bar */
  .activity { background: var(--activity); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .activity button { width: 48px; height: 48px; background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; place-items: center; border-left: 2px solid transparent; }
  .activity button.on { color: #fff; border-left-color: var(--accent); }
  .activity button:hover { color: #fff; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .side-title { height: 35px; display: flex; align-items: center; padding: 0 20px; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .section-head { display: flex; align-items: center; height: 22px; padding: 0 8px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; cursor: default; }
  .section-head .chev { width: 16px; display: grid; place-items: center; }
  .section-head .actions { margin-left: auto; display: flex; gap: 2px; }
  .section-head .actions button { background: none; border: 0; color: var(--text); cursor: pointer; width: 22px; height: 20px; border-radius: 4px; display: grid; place-items: center; }
  .section-head .actions button:hover { background: #ffffff1a; }
  .tree { overflow: auto; flex: 1; padding-bottom: 24px; outline: none; }
  .sash { cursor: col-resize; background: transparent; }
  .sash:hover, .sash.drag { background: var(--accent); }

  .row { height: 22px; display: flex; align-items: center; padding-left: calc(var(--d) * 12px + 6px); padding-right: 10px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; position: relative; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--selected); border-color: var(--accent); }
  .row .twist { width: 16px; flex: none; display: grid; place-items: center; color: var(--text); }
  .row .twist svg { transition: transform .1s; }
  .node.open > .row .twist svg { transform: rotate(90deg); }
  .row .ico { width: 16px; flex: none; margin-right: 6px; display: grid; place-items: center; font: 600 10px/1 var(--mono); }
  .row .label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .badge { font: 11px var(--mono); margin-left: 8px; }
  .row.g-M .label, .row.g-M .badge { color: var(--git-m); }
  .row.g-U .label, .row.g-U .badge { color: var(--git-u); }
  .row.ig .label { color: var(--ignored); }
  .row.has-M .label { color: var(--git-m); }
  .row.has-U .label { color: var(--git-u); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 8px; }
  .children { display: none; position: relative; }
  .node.open > .children { display: block; }
  .children::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--d) * 12px + 14px); border-left: 1px solid #585858; opacity: 0; transition: opacity .15s; z-index: 1; pointer-events: none; }
  .tree:hover .children::before { opacity: .45; }

  /* Editor */
  .editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .tabs { display: flex; background: var(--tab-bg); border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 6px; height: 35px; padding: 0 8px 0 12px; border-right: 1px solid var(--border); cursor: pointer; color: var(--muted); white-space: nowrap; border-top: 1px solid transparent; }
  .tab.on { background: var(--tab-active); color: #fff; border-top-color: var(--accent); }
  .tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; visibility: hidden; color: var(--text); }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab .x:hover { background: #ffffff1a; }
  .tab .ico { font: 600 10px/1 var(--mono); width: 16px; display: grid; place-items: center; }
  .crumbs { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 16px; color: var(--muted); font-size: 12px; flex: none; border-bottom: 1px solid #ffffff08; }
  .crumbs a:hover { color: #fff; }
  .crumbs .sep { opacity: .6; }
  .content { overflow: auto; flex: 1; }
  .page { max-width: 980px; padding: 28px 40px 60px; }

  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; color: #fff; display: flex; align-items: center; gap: 10px; }
  h1 .ico { font: 700 13px/1 var(--mono); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 10px; font-weight: 600; }
  p { margin: 0 0 12px; max-width: 78ch; }
  code { font: 12px var(--mono); background: #ffffff12; padding: 1px 5px; border-radius: 4px; color: #d7ba7d; }
  .lead { font-size: 15px; color: #e6e6e6; margin: 10px 0 18px; }
  .path { font: 12px var(--mono); color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; align-items: center; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
  .vscode { font-size: 12px; color: #3794ff; margin-left: 4px; }
  .vscode:hover { text-decoration: underline; }

  table.items { border-collapse: collapse; width: 100%; }
  table.items td { padding: 7px 12px 7px 0; border-bottom: 1px solid #ffffff0d; vertical-align: top; }
  table.items td:first-child { white-space: nowrap; width: 1%; padding-right: 20px; }
  table.items td:first-child code { color: #dcdcaa; background: none; padding: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 4px; background: #ffffff0d; border: 1px solid #ffffff14; font: 12px var(--mono); }
  .chip:hover { background: #ffffff1a; border-color: #ffffff30; }
  .chip.ext { color: var(--muted); }
  .none { color: var(--muted); font-style: italic; }

  .callout { border-left: 3px solid #cca700; background: #cca70012; padding: 10px 14px; border-radius: 0 4px 4px 0; }
  .callout ul { margin: 0; padding-left: 18px; }
  .callout li { margin: 3px 0; }
  pre.cmd { font: 12px/1.6 var(--mono); background: #0d0d0d; border: 1px solid #ffffff12; border-radius: 6px; padding: 10px 14px; overflow-x: auto; color: #9cdcfe; margin: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .card { display: flex; gap: 10px; padding: 10px 12px; border-radius: 6px; background: #ffffff08; border: 1px solid #ffffff10; }
  .card:hover { background: #ffffff12; border-color: #ffffff28; }
  .card .ico { font: 600 10px/1 var(--mono); width: 16px; margin-top: 3px; flex: none; text-align: center; }
  .card b { font: 600 12.5px var(--mono); color: #e6e6e6; display: block; }
  .card span { font-size: 12px; color: var(--muted); }

  /* Diagram */
  .diagram { background: #181818; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .diagram .n { cursor: pointer; }
  .diagram .n:hover rect, .diagram .n:hover path, .diagram .n:hover ellipse { filter: brightness(1.45); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1.5px solid; }
  ol.steps { padding-left: 20px; max-width: 80ch; }
  ol.steps li { margin: 6px 0; }

  .statusbar { background: var(--accent); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 10px; font-size: 12px; }
  .statusbar .r { margin-left: auto; display: flex; gap: 16px; }

  @media (max-width: 760px) {
    .workbench { grid-template-columns: 0 220px 0 1fr; }
    .activity { display: none; }
    .page { padding: 20px; }
  }
</style>
</head>

<div class="app">
  <div class="titlebar">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>

      <div class="tree" id="tree" tabindex="0"></div>

<script>
/* ======================================================================

const ROOT_ABS = "/Users/filippo.milzagmail.com/Desktop/NetflixScout";

const Q = "tool/rag/film/";
const M = "movie_db/";
const T = "tool/tmdb/";
const W = "tool/wikipedia/";
const Y = "tool/youtube/";
const O = "tool/omdb/";
const TV = "tool/tvmaze/";
const WD = "tool/wikidata/";
const C = "tool/cinema_db/";

const LAYERS = {
  entry:  { label: "Entry point",            color: "#b48cff" },
  orch:   { label: "Orchestrazione",         color: "#ff7eb6" },
  off:    { label: "Indicizzazione offline", color: "#2bb3a0" },
  rt:     { label: "Runtime RAG",            color: "#4a9eff" },
  data:   { label: "Dati locali",            color: "#e0a43a" },
  cfg:    { label: "Config / docs",          color: "#9da5b4" },
  out:    { label: "Output / presenter",     color: "#56d4dd" },
  test:   { label: "Test",                   color: "#73c991" },
  db:     { label: "Dati MovieLens (build)",      color: "#f78c6c" },
  tmdb:   { label: "Tool TMDb",              color: "#c3e88d" },
  youtube: { label: "Tool YouTube",          color: "#ffcb6b" },
  wikipedia: { label: "Tool Wikipedia",        color: "#89ddff" },
  omdb:   { label: "Tool OMDb",              color: "#ffa07a" },

const F = (name, info = {}) => ({ type: "file", name, ...info });
const D = (name, info = {}, children = []) => ({ type: "dir", name, children, ...info });


/* ====================================================================== */
const TREE = D("NetflixScout", {}, [

  D(".venv", {
    L: "cfg", ig: true,
    s: "Virtualenv Python 3.11 con le dipendenze installate.",
    d: `Ambiente isolato creato con <code>python3.11 -m venv .venv</code>. Contiene l'interprete e i pacchetti di <code>requirements.txt</code> (più <code>pytest</code>). È ignorato da git e non va mai committato.`,
    cmd: "source .venv/bin/activate\npip install -r requirements.txt pytest",
  }),

  D("dbVettoriale", {
    L: "data", ig: true,
    s: "Storage locale di Qdrant (non versionato): le collezioni che i due RAG leggono.",
    d: `L'unico motore vettoriale è Qdrant, in modalità server su 127.0.0.1:6333, avviato da <code>./scripts/start_qdrant.sh</code> sullo storage <code>qdrant_openai/storage</code>. Contiene <code>wikipedia_films_it_v3</code> (41.138 film, letta da <code>rag_search</code>) e <code>wikipedia_series_it_v1</code> (101.706 punti: serie, stagioni, episodi e film TV, letta da <code>series_rag_search</code>), entrambe a 1.536 dimensioni, similarità coseno. Restano anche le collezioni del vecchio RAG (<code>netflix_scout</code>, <code>wikipedia_films_it</code> v1 e v2) come dati che l'applicazione non usa. L'applicazione le legge e non le scrive mai: le costruiscono le pipeline in <code>pipelines/</code>.`,
    n: ["Mai <code>kill -9</code> su Qdrant: un secondo server sullo stesso storage va in panic con <code>Can't init WAL</code>.", "Copia verificata dello storage prima di operazioni rischiose: <code>scripts/backup_qdrant_storage.py</code>."],
  }, [
    D("qdrant_openai", { L: "data", ig: true, s: "Storage e snapshot di Qdrant.", d: `Contiene <code>storage/</code> (l'indice vivo) e <code>snapshots/</code>. Non si modifica a mano.` }),
  ]),

  D("movie_db", {
    L: "db",
    s: "MovieLens 32M come input della build di cinema_db, vocabolari e valutazioni dell'applicazione (nessun tool).",
    d: `Dal 2026-11-16 non esiste più il tool <code>movie_db_search</code>: le classifiche e i voti degli utenti sono l'operazione <code>movielens</code> di <code>cinema_sql</code>. Qui restano <code>schema.py</code> (vocabolari MovieLens), <code>harness/ingestion/</code> (il builder che dai CSV produce il file SQLite), <code>harness/evaluation/</code> (valutazioni dell'intera applicazione) e <code>data/</code> (CSV e SQLite, ignorati da git), letti solo dalla build offline di <code>cinema_db</code>. Ricostruzione: <code>docs/REBUILD.md</code>, stadio 3.`,
  }, [
    F("schema.py", {
      L: "db", s: "Tabelle, colonne, generi e DDL di MovieLens (usati dai test di parità dei vocabolari).",
      d: `Tabelle <code>movies</code>, <code>movie_genres</code>, <code>ratings</code>, <code>movie_stats</code> (voti precalcolati), <code>tags</code> (con <code>tag_norm</code>) e <code>links</code>; indici creati dopo il caricamento. <code>GENRES</code> è il vocabolario dei 19 generi MovieLens. Nessun I/O.`,
      it: [["TABLES", "Colonne per tabella: l'ingestion le usa per gli INSERT, la guardia per sapere quali tabelle si possono leggere."], ["GENRES · NO_GENRES_LABEL", "Generi validi per il parser e per la validazione."], ["normalize_tag(tag)", "Forma usata sia per salvare sia per cercare i tag (spazi compattati, minuscolo)."], ["CREATE_TABLES · CREATE_INDEXES", "DDL usato solo dall'ingestion."]],
    }),
    D("data", {
      L: "data",
      s: "Dati, non codice: CSV MovieLens scompattati e database SQLite generato.",
      d: `Ignorata da git tranne <code>.gitkeep</code> (la licenza MovieLens vieta la redistribuzione). Chi vuole ricostruire il database cinematografico scarica <code>ml-32m.zip</code> da GroupLens e lo scompatta in <code>raw/</code>; il builder SQLite (<code>movie_db/harness/ingestion/</code>) è stato ripristinato il 2026-11-19: <code>python -m movie_db.harness.ingestion.build</code>.`,

      F("movielens32m.sqlite3", { L: "data", ig: true, s: "Il database SQLite (~1,3 GB): input della build di <code>cinema_db</code>.", d: `87.585 film, 32.000.204 voti, 2.000.066 tag.`, n: ["Non si modifica a mano."] }),
      D("raw", { L: "data", ig: true, s: "Dove si scompatta <code>ml-32m.zip</code>.", d: `Percorso <code>movie_db/data/raw/ml-32m</code>.` }, [
        D("ml-32m", { L: "data", ig: true, s: "Contenuto dello zip di GroupLens (~950 MB).", d: `Letto solo dalla build offline; la chat non lo usa.` }, [
          F("movies.csv", { L: "data", ig: true, s: "Film: <code>movieId, title, genres</code> (titolo con anno tra parentesi, generi separati da <code>|</code>).", d: "Film: <code>movieId, title, genres</code> (titolo con anno tra parentesi, generi separati da <code>|</code>). Letto solo dalla build offline." }),
          F("ratings.csv", { L: "data", ig: true, s: "Circa 32 milioni di voti: <code>userId, movieId, rating, timestamp</code> (rating da 0,5 a 5).", d: "Circa 32 milioni di voti: <code>userId, movieId, rating, timestamp</code> (rating da 0,5 a 5). Letto solo dalla build offline." }),

          F("links.csv", { L: "data", ig: true, s: "Collegamenti esterni: <code>movieId, imdbId, tmdbId</code>.", d: "Collegamenti esterni: <code>movieId, imdbId, tmdbId</code>. Letto solo dalla build offline." }),

          F("checksums.txt", { L: "data", ig: true, s: "MD5 ufficiali dei quattro CSV, per verificare il download.", d: "MD5 ufficiali dei quattro CSV, per verificare il download. Letto solo dalla build offline." })
        ]),

    D("harness", {

      s: "Offline: le valutazioni dell'intera applicazione. Mai importato a runtime.",
      d: `Tutto ciò che non gira nella chat. Può importare <code>tool/</code> (la valutazione lo usa), ma non il contrario.`,
    }, [
      F("__init__.py", { L: "off", s: "Docstring: il runtime non importa questo package.", d: `Nessun codice.` }),
      D("evaluation", {
        L: "test", s: "Valutazioni dell'intera applicazione: routing del planner, preferenze, RAG, classificatore, serie (offline o con LLM reale).",
        d: `Non sono test pytest: le parti offline sono coperte da <code>tests/test_movie_db_routing_eval.py</code>, <code>tests/test_integrated_routing_eval.py</code>, <code>tests/test_preference_routing_eval.py</code>, <code>tests/test_rag_semantic_smoke.py</code> e <code>tests/test_compare_rag_runs.py</code>. Le esecuzioni live consumano crediti e partono solo con <code>--live</code> (alcune anche con una variabile di autorizzazione). Il nome della cartella è storico: oggi non valuta MovieLens ma l'intera applicazione.`,
      }, [
        F("__init__.py", { L: "test", s: "Docstring del package.", d: `Nessun codice.` }),
        F("routing_cases.py", {
          L: "test", s: "58 domande di routing: DB, RAG, TMDb, YouTube, Wikipedia e chiarimenti, con follow-up e history.",
          d: `I follow-up richiedono frammenti nella query autonoma: “E degli anni '90?” → “horror” e “90”; la trama in inglese del film appena consigliato → “sea inside”; “E dove lo posso vedere in streaming?” → “interstellar”. Ogni caso TMDb ha un <code>expected_request</code> (<code>RequestExpectation</code>: operazione, frammenti dei campi, facet), per esempio <code>movie_details</code> con titolo “dune” e facet <code>watch_providers</code>, oppure <code>trending</code> con media <code>movie</code> e window <code>week</code>. Il caso “Oh, ma chi c'era in quel film di Sorrentino…” si aspetta <code>clarification</code>: nessun tool.<br><br>Attese aggiornate il 2026-10-27 dopo una verifica live: «plot in English» → Wikipedia (regola 1c: trama dettagliata); Tom Hanks accetta anche <code>movie_details</code> con titolo «cast away»; Truman Burbank resta atteso sul RAG ma accetta TMDb solo se la richiesta nomina il film (<code>expected_alternative_request</code>: <code>movie_details</code> «truman show» o una <code>search</code> con «truman»), mentre <code>movie_details</code> con il nome del personaggio come titolo fallisce.<br><br>Casi aggiunti dopo: YouTube (<code>expected_video</code>), Wikipedia (<code>WikipediaExpectation</code>: antologie e segmenti, trilogie, confronti film–romanzo, il confine con TMDb), la copertura dei dati (i film dopo l'ultimo anno coperto vanno a <code>tmdb_search</code>) e i conteggi del RAG (<code>RagExpectation</code>, <code>expected_rag</code>: <code>k_finale</code> uguale al numero chiesto).`,
        }),
        F("run_routing_eval.py", {
          L: "test", api: 1, s: "Routing DB/RAG/TMDb con classificatore e planner reali, senza eseguire i tool.",
          d: `Per ogni domanda chiama solo <code>classify_query_domain</code> e <code>LLMOrchestrator._plan_turn</code>. <code>RecordingClient</code> salva l'output grezzo del planner, così un fallback silenzioso a <code>rag_search</code> (JSON non valido, tool sconosciuto, confidenza bassa, chiamata fallita) conta come fallimento anche se il tool è giusto. Retry automatici disattivati. Per i casi TMDb gli <code>arguments</code> del planner vengono validati come <code>TmdbToolInput</code> (pura validazione Pydantic, nessun HTTP) e almeno una richiesta deve rispettare <code>expected_request</code>. <code>--tool</code> limita il run ai casi di un tool. Un piano con <code>needs_clarification</code> conta come scelta esplicita del planner nei casi <code>clarification</code>.<br><br>Per i casi YouTube gli <code>arguments</code> sono validati come <code>YoutubeToolInput</code>; per Wikipedia come <code>WikipediaToolInput</code> (<code>check_wikipedia</code>, <code>check_any_wikipedia</code>); per il RAG <code>check_rag</code> richiede il conteggio chiesto. Un fallback silenzioso a <code>rag_search</code> resta un fallimento. Se il primo tool è un'alternativa accettata (<code>alternative_first_tools</code>) e il caso ha <code>expected_alternative_request</code>, anche la richiesta TMDb scelta è validata.`,
          dep: [M + "harness/evaluation/routing_cases.py", "app.py", "orchestrator.py", "query_classifier/query_classifier.py", T + "models/requests.py", "turn.py"],
          cmd: "python -m movie_db.harness.evaluation.run_routing_eval --live\npython -m movie_db.harness.evaluation.run_routing_eval --live --tool tmdb_search",
          x: ["openai", "pydantic"],
          n: ["Run completo: 34 chiamate, 17 a <code>gpt-4o-mini</code> e 17 a <code>gpt-5.6-luna</code>; con <code>--tool tmdb_search</code> 12 (6 + 6). <code>--live</code> è obbligatorio.", "Ultimo esito: 17/17 in un run da 34 chiamate (TMDb mirato 6/6, 12 chiamate). Il tool TMDb non viene eseguito: i dati reali non sono verificati."],
        }),
        F("run_rag_infra_check.py", { L: "test", s: "Controllo dell'infrastruttura dei due RAG su Qdrant con vettori già memorizzati: nessun modello, nessun embedding.", d: `Esegue i retriever veri (filtri, esclusioni, penalità) sulle collezioni vere e continua in <code>cinema_sql</code> per <code>imdb_id</code>. Non prova la qualità semantica di una richiesta in testo libero.`, cmd: "python -m movie_db.harness.evaluation.run_rag_infra_check", dep: ["tool/rag/series/retrieval", "tool/cinema_db/tool.py"] }),
        F("run_rag_semantic_smoke.py", { L: "test", s: "Qualità semantica dei due RAG con richieste in testo libero, sul percorso applicativo reale (24 richieste, prova ridotta 2+2).", d: `Chiama <code>RagTool</code> e <code>SeriesRagTool</code> veri con un client OpenAI che registra fase, tempi e token; attribuisce gli errori a parser, embedding, retrieval o riordino. A pagamento solo con <code>--live</code> e <code>RAG_SEMANTIC_AUTHORIZED=yes</code>; <code>plan</code>, <code>validate</code> e <code>report</code> sono offline. Casi in <code>rag_semantic_cases.json</code>.`, cmd: "python -m movie_db.harness.evaluation.run_rag_semantic_smoke plan --set smoke", dep: ["tool/rag/series/tool.py", "tool/rag/film/tool.py"] }),
        F("compare_rag_runs.py", { L: "test", s: "Confronto offline di due esecuzioni semantiche dei RAG: quali celle dei primi tre posti vanno rivalutate.", d: `Nessun modello, nessuna scrittura; non giudica.` }),
        F("rag_review_rules.py", { L: "test", s: "Le regole della revisione manuale della batteria semantica, fissate prima della seconda esecuzione.", d: `Classi aperte, a risposta unica, nota, vuoto, esclusa; soglie film 10/12 e serie 9/11.` }),
        F("run_preference_routing_eval.py", { L: "test", s: "Planner REALE sotto <code>content_type</code> film / serie / entrambi, con tool finti.", d: `40 celle dalla matrice delle preferenze; registra i tool eseguiti, i passi vietati proposti e i conflitti dichiarati; tetto di chiamate. A pagamento solo con <code>--live</code> e <code>PREF_ROUTING_AUTHORIZED=yes</code>. Casi in <code>preference_routing_cases.py</code>.`, cmd: "python -m movie_db.harness.evaluation.run_preference_routing_eval plan", dep: ["orchestrator.py", "preferences/policy.py"] }),
      ]),
    ]),
  ]),

  D("cinema_db", {
    L: "cinema",
    s: "Lato <b>database</b> del DB cinematografico locale (schema, note, generatore della documentazione, baseline): non è codice di runtime.",
    d: `Come <code>movie_db/</code> per MovieLens, ma separato. Qui vivono lo schema (32 tabelle STRICT più l'indice FTS5 <code>entity_name_fts</code>, viste pubbliche, generi normalizzati, vocabolari di definizione), le descrizioni, la build offline e gli strumenti di verifica. Il file usato a runtime è <code>cinema_db/data/cinema.v4.candidate6.sqlite3</code> (schema 4: il catalogo di Wikipedia e Wikidata, il livello IMDb e <b>tutto MovieLens</b>, ignorato da git); la candidata si nomina in UN solo posto, <code>harness/candidate.py</code>. <code>cinema.sqlite3</code> (schema 2), <code>wikidata_phase4/</code> e <code>imdb_snapshot/</code> restano come input di ricostruzione. Il tool a runtime è <code>tool/cinema_db/</code>. Documentazione generata dal file reale: <code>docs/cinema_db/schema.html</code> (apribile con un doppio clic) e <code>schema.mmd</code>.`,
    cmd: "python -m cinema_db.harness.schema.generate --check",
  }, [
    D("data", {
      L: "data", ig: true,
      s: "I file SQLite del database cinematografico (non versionati, ricostruibili).",
      d: `<code>cinema.v4.candidate6.sqlite3</code> è il file che <code>cinema_sql</code> apre a runtime (schema 4: catalogo, livello IMDb e tutto MovieLens; digest dei dati in <code>harness/candidate.py</code>). Restano come input di ricostruzione <code>cinema.sqlite3</code> (schema 2), <code>wikidata_phase4/</code> (1.129 richieste mirate a Wikidata) e <code>imdb_snapshot/</code> (dataset IMDb acquisiti il 2026-11-08, sola lettura). Ignorata da git.`,
      n: ["Dopo ogni costruzione grande confronta <code>build_info.content_sha256</code> con il rapporto della build: il progetto sta su iCloud, che ha già creato copie di conflitto («… 2»).", "Ricostruzione: <code>python -m cinema_db.harness.build.imdb_layer --movielens --out PERCORSO_NUOVO</code>, poi <code>verify_movielens</code>."],
    }),
    F("schema.py", { L: "cinema", s: "DDL di tabelle, indici e viste; vocabolari di definizione; <code>create_database</code>.", d: `Unica fonte della struttura. Supertipo <code>entity</code> con FK composta, <code>work</code> unico per film, serie, stagioni, episodi e opere d'origine, nomi e identificativi normalizzati, provenienza su ogni riga e <code>field_provenance</code> per colonna. Nessun dato inventato: solo tipi di opera, ruoli, relazioni e schemi di identificativo. <code>create_database</code> rifiuta di sovrascrivere un file esistente.` }),
    F("schema_notes.py", { L: "cinema", s: "Descrizioni di tabelle, colonne e viste.", d: `Mai la struttura (quella si legge dal file): solo il testo. Il generatore fallisce se manca una descrizione o se ne esiste una per qualcosa che non c'è; le descrizioni delle viste alimenteranno il prompt del planner.`, dep: ["cinema_db/schema.py"] }),
    F("schema_v3.py", { L: "cinema", s: "Schema v3: le cinque tabelle <b>aggiuntive</b>, le cinque viste nuove (<code>v_work_status</code>, <code>v_work_rating</code>, <code>v_entity_claim</code>, <code>v_external_id_candidate</code>, <code>v_entity_canonical</code>) e le sei ridefinite dello strato della fase 9 (<code>work_rating</code>, <code>entity_claim</code>, <code>external_id_candidate</code>, <code>work_status</code>, <code>entity_canonical</code>) e le sei viste ridefinite che risolvono la mappa canonica.", d: `Applicato da <code>imdb_layer.py</code> a una COPIA del database v2; non cambia nessuna tabella, vista o colonna esistente. Il tool <code>cinema_sql</code> non legge un file v3 finché non si rigenerano policy e viste (fase F).`, dep: ["cinema_db/harness/build/imdb_layer.py"] }),
    D("harness", { L: "cinema", s: "Strumenti offline, mai importati a runtime.", d: `Baseline della fase 0 e generatore della documentazione dello schema.` }, [
      F("candidate.py", { L: "cinema", s: "Fase 21: l'UNICO posto che nomina il database di schema 4 su cui si validano (percorso, versione di schema, digest dei dati) e controlla che un file lo sia davvero.", d: `Sola lettura. Nessun ripiego su un altro file: <code>identify()</code> solleva <code>CandidateMismatch</code>. Il digest dei dati non copre gli indici, quindi anche il nome del file fa parte dell'identità.` }),
      D("schema", { L: "cinema", s: "Introspezione del file SQLite e generazione di schema.html, schema.mmd e della policy.", d: `Tutto parte dal file SQLite reale (PRAGMA, sqlite_master, authorizer di registrazione per le colonne base di ogni vista).`, cmd: "python -m cinema_db.harness.schema.generate" }, [
        F("introspect.py", { L: "cinema", s: "Legge tabelle, colonne, chiavi, indici, check, viste e le colonne base che ognuna legge.", d: `Calcola relazioni (uno-a-molti, uno-a-uno, sottotipo, ponte), molti-a-molti e il digest della struttura; <code>check_notes</code> segnala descrizioni mancanti o superflue.`, dep: ["cinema_db/schema_notes.py"] }),
        F("render.py", { L: "cinema", s: "Produce l'HTML autonomo (JSON incorporato + piccolo script) e il diagramma Mermaid.", d: `Nessuna libreria esterna. L'HTML incorpora l'intera struttura in un blocco JSON da cui la pagina si disegna; un test lo confronta con una nuova introspezione.` }),
        F("generate.py", { L: "cinema", s: "Comando: scrive schema.html, schema.mmd e approved_views.py; <code>--check</code> verifica che non siano obsoleti.", d: `Con <code>--db FILE</code> mostra conteggi e fonti reali. Fallisce se le descrizioni non sono complete.`, dep: ["cinema_db/harness/schema/introspect.py", "cinema_db/harness/schema/render.py", "cinema_db/schema.py", "tool/cinema_db/approved_views.py"] }),
        F("generate_v3.py", { L: "cinema", s: "Mappa HTML interattiva di un database v3, letta dal file SQLite reale.", d: `Aggiunge in memoria le descrizioni delle quattro tabelle v3 (le note committate descrivono il v2). Scrive solo <code>docs/cinema_db/schema_v3.html</code>.`, cmd: "python -m cinema_db.harness.schema.generate_v3 --db cinema_db/data/cinema.v3.sqlite3", dep: ["cinema_db/harness/schema/introspect.py", "cinema_db/harness/schema/render.py", "cinema_db/schema_v3.py"] }),
        F("map_view.py", { L: "cinema", s: "<b>La mappa grafica del database</b> dentro schema.html: grafo di tabelle e chiavi esterne con zoom, spostamento, ricerca, evidenziazione.", d: `CSS e JavaScript come testo; disegna dallo stesso JSON incorporato (letto dal file SQLite), senza librerie né rete. Un nodo per tabella, un arco per chiave esterna con i simboli di cardinalità ER, tabelle ponte, sottotipi, chiavi facoltative e riferimenti a sé stesse distinti; i collegamenti a <code>source</code> sono nascosti finché non si seleziona una tabella; layout deterministico. Test: <code>tests/test_cinema_schema_map.py</code> (confronto con le PRAGMA di SQLite, funzioni pure del grafo eseguite in Node).`, cmd: "python -m cinema_db.harness.schema.generate --db cinema_db/data/cinema.sqlite3", dep: ["cinema_db/harness/schema/render.py", "cinema_db/harness/schema/introspect.py"] }),
      ]),
      D("build", { L: "cinema", s: "Fase 3: prima build offline del database dalle sole fonti locali, indagine preliminare e verifica.", d: `Nessuna rete, nessun credito, nessun embedding. Legge in sola lettura gli snapshot Wikidata dei progetti film e serie e i cataloghi film v3 e serie s5; scrive su un file temporaneo e lo rinomina solo se tutti i controlli passano. Deterministica: il digest del contenuto (<code>build_info.content_sha256</code>) deve coincidere in una seconda build.`, cmd: "python -m cinema_db.harness.build.build --force" }, [
        F("snapshot.py", { L: "cinema", s: "Lettore in sola lettura degli snapshot Wikidata (indice + corpi compressi, hash verificato).", d: `Ogni corpo è confrontato con lo sha256 registrato: un file alterato o scambiato viene rilevato, mai creduto.` }),
        F("extract.py", { L: "cinema", s: "Estrazione pura dei fatti di UNA entità Wikidata (ruoli, generi, paesi, date, importi, premi, relazioni, ID).", d: `Nessun I/O. Ignora le dichiarazioni deprecate, preferisce il rango preferito, legge le date secondo la precisione e accetta solo importi interi non negativi con unità. Usata da indagine e build.` }),
        F("common.py", { L: "cinema", s: "Normalizzazione dei nomi (ogni scrittura), date italiane e titoli delle pagine Wikipedia.", d: `Funzioni pure. «14 ottobre 2024 (Hulu)» è una data, «14 dicembre 1988 Ci sono dubbi…» no.` }),
        F("genres.py", { L: "cinema", s: "Vocabolario canonico di 38 generi e regole che mappano le etichette delle fonti.", d: `Exact, synonym, specific con identificativo della regola; precisione sopra la copertura: una voce non riconosciuta resta non mappata e leggibile.` }),
        F("sources.py", { L: "cinema", s: "Registro delle fonti con licenza, scopo d'uso, attribuzione e hash degli input.", d: `Gli hash vengono calcolati dai file reali. Il vocabolario dei generi è registrato come «unverified»: la licenza di un'opera scritta per il progetto spetta al proprietario.` }),
        F("build.py", { L: "cinema", s: "La build: opere, persone con nome, ID, generi, paesi, uscite, importi USD, relazioni, serie, stagioni, episodi.", d: `Il catalogo serie decide le opere televisive e quello film vi aggiunge ciò che sa (un'opera in entrambi i cataloghi è una sola opera). Importa un fatto solo se le fonti locali lo dicono E nominano a cosa si riferisce; il resto (persone con solo il QID, premi, società e franchise senza nome, valute diverse da USD) è lasciato alla fase 4 e contato. Controlli finali: chiavi esterne, integrità, FTS5, un solo nome primario per entità.` , dep: ["cinema_db/harness/build/snapshot.py", "cinema_db/harness/build/extract.py", "cinema_db/harness/build/genres.py", "cinema_db/schema.py"] }),
        F("phase4.py", { L: "cinema", s: "Lettore dello snapshot della fase 4: etichette, date di vita con precisione e rango, i pochi claim usati da premi, paesi, lingue, valute, società.", d: `Funzione pura e offline, opzionale: senza la cartella <code>cinema_db/data/wikidata_phase4</code> la build è quella della fase 3. Non sovrascrive mai ciò che le fonti vecchie dicono.`, dep: ["cinema_db/harness/build/snapshot.py", "cinema_db/harness/build/extract.py"] }),
        F("survey.py", { L: "cinema", s: "Indagine prima della build: cosa danno le fonti locali e quanto servirebbe alla fase 4.", d: `Scrive <code>docs/cinema_db/SURVEY.md</code>. Il fabbisogno di richieste è una stima (50 id per richiesta); il tetto di IMDb è un limite superiore, non una misura.` }),
        F("verify.py", { L: "cinema", s: "Verifica indipendente del file: integrità, copertura, campione di 400 film ricalcolato dalle fonti, interrogazioni reali, riproducibilità.", d: `Scrive <code>docs/cinema_db/BUILD_REPORT.md</code>. Con <code>--reproduce</code> rifà la build in una cartella temporanea e confronta il digest.`, dep: ["cinema_db/harness/build/build.py", "tool/cinema_db/approved_views.py"] }),
        F("imdb_layer.py", { L: "cinema", s: "Fase 9: costruisce un file v3 (<code>cinema.v3.reconciled.sqlite3</code>) da una copia del v2 più archivio IMDb, aggregati MovieLens e cataloghi locali.", d: `Recupera gli ID dei record con <code>ids_reliable=false</code> solo se IMDb conferma titolo, anno e tipologia; attacca gli ID IMDb delle persone solo con prova forte; applica la priorità IMDb per tipologia, anno e durata conservando il valore perdente in <code>entity_claim</code>; aggiunge valutazioni per fonte, collega gli episodi, inserisce opere nuove (MovieLens, pagine italiane senza trama) con i crediti, senza duplicati né fusioni sul nome. Dalla seconda tornata: ID IMDb primario per regola, 12 fusioni reversibili di persone (<code>entity_canonical</code>), ID per anno di nascita, rilascio dei titoli trattenuti provati distinti, importazione degli episodi, crediti tramite persone candidate. Il file runtime non viene toccato.`, cmd: "python -m cinema_db.harness.build.imdb_layer --force", dep: ["cinema_db/schema_v3.py", "cinema_db/harness/audit/imdb_sections.py", "cinema_db/harness/build/build.py", "cinema_db/harness/build/reconcile_rules.py"] }),
        F("title_keys.py", { L: "cinema", s: "Chiavi di titolo con le lettere di ogni alfabeto per il controllo «stesso titolo e anno».", d: `Il vecchio <code>norm_title</code> è ASCII e rendeva vuoto un titolo non latino; una chiave vuota non corrisponde mai a nulla. Include <code>person_key</code> per i nomi.`, dep: [] }),
        F("person_merge_report.py", { L: "cinema", s: "Rapporto di sola lettura sulle persone create per candidati deboli: contraddette, a rischio omonimo, plausibili.", d: `Non fonde nulla e non modifica il database; scrive un JSONL accanto al file.`, cmd: "python -m cinema_db.harness.build.person_merge_report --db cinema_db/data/cinema.v3.reconciled2.sqlite3", dep: [] }),
        F("reconcile_rules.py", { L: "cinema", s: "Regole pure della riconciliazione (fase 9): ID primario, controllo delle fusioni, proprietario di un ID condiviso, rilascio dei titoli trattenuti, strato del titolo unico.", d: `Nessun I/O: la build raccoglie i fatti, queste funzioni decidono. Ogni regola è prudente: se manca un dato non si agisce.`, dep: [] }),
        F("verify_reconciled.py", { L: "cinema", s: "Verifica indipendente di una v3 riconciliata: struttura, conteggi, 100 interrogazioni sulle viste, confronto con v2 e v3 precedente.", d: `Sola lettura, offline. Scrive <code>NOME.verify.json</code> accanto al file.`, cmd: "python -m cinema_db.harness.build.verify_reconciled --new cinema_db/data/cinema.v3.reconciled.sqlite3", dep: ["cinema_db/harness/build/imdb_layer.py"] }),
        F("movielens_layer.py", { L: "cinema", s: "Fase 10: film, generi e tag di MovieLens dentro il file di schema 4 (<code>ml_movie</code>, <code>work_ml_genre</code>, <code>work_tag</code>), con il motivo di ogni esclusione.", d: `Un film MovieLens entra solo tramite l'ID IMDb che MovieLens dà (mai per titolo); un ID di episodio vale solo se titolo e anno MovieLens concordano con IMDb; le coppie film-tag contano gli utenti distinti. <code>add_indexes</code> porta un file costruito all'ultimo elenco di indici.`, cmd: "python -m cinema_db.harness.build.imdb_layer --movielens --out PERCORSO_NUOVO", dep: ["cinema_db/schema_v3.py", "cinema_db/harness/build/imdb_layer.py", "cinema_db/harness/build/reconcile_rules.py"] }),
        F("verify_movielens.py", { L: "cinema", s: "Verifica indipendente di un file di schema 4 contro il MovieLens originale e contro la base (tabelle invariate, voti, generi, tag).", d: `Sola lettura, offline; scrive <code>docs/cinema_db/PHASE10_VERIFY.json</code>.`, cmd: "python -m cinema_db.harness.build.verify_movielens --new cinema_db/data/cinema.v4.candidate6.sqlite3", dep: ["cinema_db/harness/build/movielens_layer.py"] }),
        F("id_rules.py", { L: "cinema", s: "Fase 21: forma degli identificativi per schema (<code>tt…</code>, <code>nm…</code>, <code>Q…</code>, numeri) e lettura delle correzioni verificate.", d: `Un valore con la forma sbagliata non è un identificativo di quello schema: il builder del livello lo toglie, tiene il valore scartato come <code>entity_claim</code> e lo sostituisce solo con una correzione verificata di <code>id_overrides.json</code>.` }),
        F("id_overrides.json", { L: "cinema", s: "Correzioni verificate di identificativi con forma sbagliata (oggi una: <i>Tumbling</i>, <code>nm1627110</code> → <code>tt1627110</code>), con le prove.", d: `Applicate solo al record esatto che ha fornito il valore e solo se il sostituto esiste nell'archivio IMDb locale con tipo e anno compatibili.` }),
      ]),
      D("acquire", { L: "cinema", s: "Fase 9: acquisizione dei dataset IMDb autorizzati (UNICO codice di rete della fase).", d: `Solo i sei dataset approvati dal proprietario, solo da <code>datasets.imdbws.com</code>, uno per invocazione; file in sola lettura in <code>cinema_db/data/imdb_snapshot/&lt;data&gt;/</code> con <code>manifest.json</code> (URL, data, byte, sha256).`, cmd: "python -m cinema_db.harness.acquire.imdb verify" }, [
        F("imdb.py", { L: "cinema", s: "Scarica un dataset alla volta con hash e manifest; non riscarica né sovrascrive.", d: `Rifiuta dataset non approvati e host diversi; il test usa un server locale.`, dep: [] }),

  D("query_classifier", {
    L: "orch",
    s: "Il guardrail attuale: la domanda riguarda il cinema? È in italiano?",
    d: `Viene chiamato da <code>app.py</code> prima dell'orchestratore, a ogni turno, insieme all'ultimo scambio della conversazione (<code>classifier_context_messages</code>). Se la domanda non riguarda il cinema la chat risponde con una sola riga secca (<code>block_reply</code>, scritta dal classificatore nella lingua dell'utente, qualunque sia), senza stadi, storia o riquadri e senza toccare né RAG né orchestratore.`,
  }, [
    F("__init__.py", { L: "orch", s: "Re-esporta <code>classify_query_domain</code>.", d: `Permette di scrivere <code>from …query_classifier import classify_query_domain</code>.`, dep: ["query_classifier/query_classifier.py"] }),
    F("query_classifier.py", {
      L: "orch", s: "<code>classify_query_domain(query, history=None)</code> → <code>{is_cinema, language, block_reply}</code>; <code>language</code> è il codice ISO 639-1 dell'ultimo messaggio.",
      d: `Chiama <code>gpt-4o-mini</code> (<code>CHEAP_MODEL</code>) con temperatura 0 e <code>response_format = json_object</code>. Il prompt di sistema accetta film, serie TV, documentari, attori, registi, richieste implicite di consigli e domande statistiche su voti, classifiche, generi e tag anche senza la parola “film” (es. “Qual è il genere con il voto medio più alto?”), e ignora esplicitamente i tentativi di jailbreak contenuti nella query. Dal 2026-10-27 il prompt dichiara cinematografici anche i seguiti impliciti su un film o una persona appena citati (dove vederlo, formazione, cast, durata) e le domande enciclopediche sul cinema (storia e produzione, doppiaggio, correnti, biografie, confronto con l'opera d'origine), ma non i temi storici o letterari senza legame col cinema. Verificato live: i 4 casi che prima fallivano (streaming di Interstellar, formazione, doppiaggio, Solaris) 12/12 e 8 controlli off-topic e jailbreak bloccati (campione piccolo). <code>_validate_classification</code> garantisce che la risposta contenga due booleani.<br><br><b>Rifiuto nella lingua dell'utente.</b> Il modello scrive prima <code>query_language</code> (nome inglese della lingua) e poi <code>block_reply</code>: una frase secca, in quella lingua, che dice che risponde solo a domande di cinema (il prompt dà due esempi, tedesco e spagnolo; senza <code>query_language</code> o con la frase d'esempio inglese il modello rispondeva sempre in italiano o in inglese). Se la query è di cinema <code>block_reply</code> è <code>None</code>; <code>_clean_block_reply</code> lo accetta solo se è una riga non vuota di al massimo <code>MAX_BLOCK_REPLY_CHARS</code> (200) caratteri, altrimenti <code>None</code> e il chiamante usa il messaggio fisso. Provato live su 16 domande in 9 lingue (tedesco incluso); la qualità della traduzione dipende da <code>gpt-4o-mini</code>.<br><br><b>Contesto della conversazione.</b> Se riceve <code>history</code> (da <code>app.py</code> arrivano gli ultimi <code>classifier_context_messages</code> = 2 messaggi, cioè l'ultimo scambio domanda/risposta), <code>_context_messages</code> la mette in un messaggio “Conversazione precedente (solo contesto)” prima della domanda, che resta l'ultimo messaggio. Il prompt dice di usarla solo per risolvere riferimenti impliciti (“ne puoi trovare 3 più recenti?”), di classificare sempre l'ultima query (un cambio di argomento resta <code>is_cinema = false</code>) e di calcolare <code>is_italian</code> solo sull'ultima query. Senza history i messaggi sono <code>[system, query]</code>, come prima. <code>detect_language_markers</code> (parole funzionali it/en) sovrascrive <code>is_italian</code> solo con almeno 2 marcatori di una lingua e nessuno dell'altra: i titoli citati nella history non decidono la lingua del follow-up.`,
      it: [
        ["classify_query_domain(query, history=None)", "Una chiamata OpenAI per ogni domanda; <code>history</code> è solo contesto."],
        ["_context_messages(history)", "Trascrizione <code>[ruolo]\ncontenuto</code> della history in un unico messaggio di contesto (lista vuota se non c'è history)."],
        ["QueryClassification", "TypedDict del risultato."],
        ["_validate_classification(raw)", "Controllo del JSON restituito: <code>is_cinema</code> booleano obbligatorio, <code>language</code> normalizzato (<code>turn.normalize_language</code>; non valido = <code>None</code>, mai un errore)."],
        ["resolve_language(model_language, query)", "Lingua del turno: il codice del modello, corretto dai marcatori it/en solo se il modello ha detto it/en o nulla, altrimenti <code>en</code>."],
      ],
      x: ["openai"],
      n: ["Fa parte della difesa anti off-topic e anti jailbreak: non indebolirla senza permesso.", "Perché il contesto: il guardrail gira <b>prima</b> della riscrittura <code>standalone_query</code> dell'orchestratore. Senza contesto un follow-up come “Ne puoi trovare 3 più recenti rispetto al 94?” non contiene parole di cinema e veniva bloccato.", "Nella history finiscono solo turni già accettati: quelli bloccati non vengono salvati, quindi il contesto è sempre cinematografico.", "Testato con mock in <code>tests/test_query_language.py</code> (messaggi con e senza history, testo del prompt) e <code>tests/test_presenters.py</code> (cosa passa <code>handle_query</code>). I test con mock non provano il comportamento del modello: quello è verificato solo dalle chiamate live."],
    }),
  ]),

    F("enrich.py", { L: "tmdb", s: "<code>TmdbRagEnricher</code>: completa con TMDb i film scelti dal RAG.", d: `Dopo <code>rag_search</code> l'orchestratore gli passa il risultato. Prende i chunk finali (dopo il rerank, al massimo <code>max_candidates</code>, nell'ordine del RAG, senza duplicati), cerca ogni titolo in <code>en-US</code> senza filtro d'anno (<code>year_after_search</code>: un candidato costa 2 chiamate, ricerca + dettagli, anche se l'anno del corpus è sbagliato di 1; la ricerca con filtro è solo il ripiego) e aggiunge in <code>metadata.tmdb_enrichment</code> titolo, anno, regista, cast e sinossi solo se titolo e anno (±1) coincidono; altrimenti <code>unverified</code>, <code>not_found</code> o <code>skipped</code>. Non riordina i chunk e usa un solo budget, creato da <code>TmdbTool.new_context</code>. Un candidato riceve metadati solo con titolo o titolo originale uguali (mai per inclusione: “The Sinner” non è “The Sinners”) e anno ±1, in <code>strict_identity</code> (più risultati ugualmente validi → <code>ambiguous</code>). Un match tramite titolo alternativo o articolo (<code>matched_by: alternative_title</code>) richiede anche un attore in comune quando i cast sono noti (<code>cast_mismatch</code>); un anno confermato da una data di uscita secondaria dà <code>year_note</code>. Durata 0 scartata.<br><br>Lo step <code>tmdb_calls</code> del completamento porta le card solo per i film verificati (<code>matched</code>): un risultato TMDb non verificato non è il film del RAG.`, dep: [T + "tool.py", T + "runner.py", T + "trace.py"] }),

      F("discovery.py", { L: "tmdb", s: "<code>discover_movies</code> / <code>discover_tv</code> con filtri.", d: `Generi, persone, case, keyword e provider vengono prima risolti in ID; se uno non si risolve, discover non parte, perché filtri parziali darebbero risultati sbagliati. Con l'ordinamento per voto applica un numero minimo di voti. <br><br><b>Film recenti e futuri</b>: senza <code>include_unreleased</code> il limite superiore è la data di oggi (<code>ctx.today()</code>) e i titoli con uscita futura (o, in una lista per date, senza data) sono scartati con le note <code>excluded_unreleased</code> / <code>excluded_undated</code>; con <code>include_unreleased</code> e senza <code>year_from</code> la lista parte da domani.`, dep: [T + "operations/resolve.py", T + "operations/reference.py", T + "operations/listing.py"] }),

      F("entities.py", { L: "tmdb", s: "Oggetti TMDb → <code>Entity</code>: identità (P0), essenziali (P1), facet (P2).", d: `Un normalizzatore per film, serie, stagione, episodio, persona, raccolta, casa di produzione ed elemento di lista. Trama e titolo vuoti nella lingua del turno vengono presi dalle <code>translations</code>, con <code>overview_language</code>. Le durate pari a 0 diventano assenti (<code>positive_minutes</code>); per le serie <code>episode_runtime_minutes</code> compare solo se TMDb lo fornisce, e non c'è mai una regia di serie.<br><br>Film, serie e voci di lista riportano <code>release_date</code> (o <code>first_air_date</code>) e <code>poster_path</code>.`, dep: [T + "normalize/common.py", T + "normalize/facets.py", T + "models/results.py"] }),

    d: `Definisce il <code>Tool</code> Protocol (<code>name</code>, <code>description</code>, <code>input_schema</code>, <code>run(*, query, params, conversation_history)</code>) e l'<code>Enricher</code>. <code>run(..., observer=)</code>:<br>1) <b>pianificazione</b> (<code>_plan_first</code>, una chiamata LLM; <code>_plan_turn</code> ne è il wrapper a tupla usato dal routing eval): JSON <code>{standalone_query, tool_name, arguments, confidence, parts, more_steps}</code>. <code>standalone_query</code> è la domanda riscritta in modo autonomo usando la history: vale per qualunque tool, anche con <code>required_tools</code> o fallback. Le <code>parts</code> sono le parti della richiesta, ciascuna col suo tool; serve un altro passo se <code>more_steps</code> è vero o una parte ha un altro tool. Alle istruzioni si aggiunge il catalogo dei tool (nome, descrizione, schema in JSON compatto). Se il planner fallisce, ha confidenza bassa o nomina un tool sconosciuto gira il <code>fallback_tool</code> e il motivo (<code>planner_failed</code>, <code>low_confidence</code>, <code>unknown_tool</code>) viene registrato;<br>2) <b>ciclo multi-tool</b>: per ogni passo emette lo step <code>tool_selection</code> (con <code>purpose</code> = la parte della richiesta, e <code>arguments</code>) <b>prima</b> di chiamare il tool, poi lo step <code>tool_outcome</code> (<code>elapsed_ms</code>, <code>status</code>, <code>reason</code>, letti da <code>result["outcome"]</code>; senza, conta la presenza di <code>chunks</code>) e la <code>trace</code> del tool; <code>_enrich</code> completa i risultati RAG con TMDb. Tra un passo e l'altro <code>_plan_next</code> (una chiamata in più) decide il successivo dai risultati già ottenuti o ritorna <code>done</code>; non ripiega mai su un tool. Gira anche, senza altre parti pendenti, quando un tool offre altro con <code>follow_up</code> (<code>available</code>, motivi, riassunto): il planner giudica se ciò che c'è basta, altrimenti sceglie il passo successivo. La fine del ciclo è classificata da <code>_classify_next_step</code>: conclusione esplicita (<code>done: true</code> o un segnale di stop del contratto <code>NEXT_STEP_FORMAT</code>) senza avvisi; risposta incompleta o contraddittoria = <code>planner_incomplete</code> con l'avviso <code>next_step_failed</code>; testo non JSON = <code>planner_failed</code>. <code>planner_output</code> registra cosa ha risposto il planner senza testo libero né argomenti. Il ciclo finisce con <code>complete</code>, <code>done</code>, <code>repeated_step</code>, <code>unknown_tool_or_low_confidence</code>, <code>planner_failed</code>, <code>required_tools</code> o <code>max_tool_calls</code> (<code>max_tool_calls_per_turn</code>, 10); le parti rimaste senza tool arrivano alla risposta come “NON eseguite” (mai “non trovate”);<br>3) <b>risposta finale</b>: emette lo step <code>planning</code> (se i tool sono più di uno, ci sono parti non eseguite o fallback) e lo stadio <code>answering</code>, poi costruisce il contesto con history + al massimo 10 chunk per tool e le istruzioni <code>final_instructions</code> più <code>tool_final_instructions</code> di ogni tool usato. La risposta è UNA sola chiamata <code>responses.create(stream=True)</code>, mai una seconda: <code>_consume_stream</code> legge gli eventi dell'SDK e il testo va a <code>observer.answer_delta</code>. Con <code>final_output</code> (web) i delta grezzi sono JSON strict <code>{answer, lists}</code> e passano da <code>AnswerFieldStream</code>: il canale vede solo il testo di <code>answer</code> già decodificato; <code>lists</code> arriva dal parse del JSON completo. Se il flusso fallisce (incompleto, errore, refusal, JSON non valido): dopo alcuni delta la risposta è il testo già mostrato, senza delta il ripiego esistente (anch'esso emesso come delta), in entrambi i casi fallback <code>answer_failed</code> (che produce un secondo step <code>planning</code> minimo) e la cronologia contiene ciò che l'utente ha visto.<br>Con <code>needs_clarification</code> (mai con <code>required_tools</code>) <code>run</code> non esegue tool né la chiamata finale: la domanda è la risposta e <code>tool</code> vale None.<br>L'<code>observer</code> riceve gli step <b>mentre accadono</b>; gli errori dell'osservatore sono ignorati. Il dict restituito non dipende da lui.`,

function buildNode(n, depth) {
  const wrap = document.createElement("div");
  wrap.className = "node" + (OPEN_DEFAULT.has(n.path) ? " open" : "");
  const row = document.createElement("div");
  row.className = "row";
  row.style.setProperty("--d", depth);
  row.dataset.path = n.path;
  row.title = n.path;
  if (n.g) row.classList.add("g-" + n.g);
  if (n.ig) row.classList.add("ig");
  let badge = n.g ? `<span class="badge">${n.g}</span>` : "";
  if (n.type === "dir" && !n.g && n.gitInside && n.gitInside.size) {
    const k = n.gitInside.has("M") ? "M" : "U";
    row.classList.add("has-" + k);
    badge = `<span class="dot" style="background:var(--git-${k.toLowerCase()})"></span>`;
  }
  row.innerHTML =
    `<span class="twist">${n.type === "dir" ? CHEV : ""}</span>` +
    `<span class="ico">${icon(n)}</span>` +
    `<span class="label">${n.name}</span>${badge}`;
  wrap.appendChild(row);
  WRAP.set(n.path, wrap);
  if (n.type === "dir") {
    const kids = document.createElement("div");
    kids.className = "children";
    kids.style.setProperty("--d", depth);
    n.children.forEach(c => kids.appendChild(buildNode(c, depth + 1)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function reveal(path) {
  const parts = path.split("/");
  for (let i = 1; i < parts.length; i++) {
    const w = WRAP.get(parts.slice(0, i).join("/"));
    if (w) w.classList.add("open");

  const w = WRAP.get(path);

    const row = w.querySelector(":scope > .row");
    row.classList.add("active");
    const tr = treeEl.getBoundingClientRect(), rr = row.getBoundingClientRect();

/* Tastiera: frecce su/giù, destra/sinistra per aprire/chiudere */
treeEl.addEventListener("keydown", ev => {
  const rows = [...treeEl.querySelectorAll(".row")].filter(r => r.offsetParent !== null);
  let i = rows.findIndex(r => r.classList.contains("active"));
  const cur = rows[i] && BY_PATH.get(rows[i].dataset.path);
  if (ev.key === "ArrowDown") i = Math.min(rows.length - 1, i + 1);
  else if (ev.key === "ArrowUp") i = Math.max(0, i - 1);
  else if (ev.key === "ArrowRight" && cur && cur.type === "dir") { WRAP.get(cur.path).classList.add("open"); ev.preventDefault(); return; }
  else if (ev.key === "ArrowLeft" && cur) {
    if (cur.type === "dir" && WRAP.get(cur.path).classList.contains("open")) WRAP.get(cur.path).classList.remove("open");
    else if (cur.parentPath) go(cur.parentPath);
    ev.preventDefault(); return;
  } else return;
  ev.preventDefault();
  if (rows[i]) go(rows[i].dataset.path);
});

function open(path) {
  if (path && path !== START && !BY_PATH.has(path)) path = "";

function chip(p) {
  const n = BY_PATH.get(p);
  if (!n) return `<span class="chip ext">${p}</span>`;
  return `<a class="chip" href="#${p}" title="${strip(n.s || "").replace(/"/g, "&quot;")}"><span style="display:grid;place-items:center;width:14px">${n.type === "dir" ? FOLDER_ICO : icon(n)}</span>${p}</a>`;
}

function renderNodePage(n) {
  const isDir = n.type === "dir";
  const vs = `vscode://file${ROOT_ABS}/${n.path}`;
  let h = `<div class="page">
    <h1><span class="ico" style="display:grid;place-items:center">${isDir ? FOLDER_ICO : icon(n)}</span>${n.name}${isDir ? "/" : ""}</h1>
    <div class="path">${n.path}${isDir ? "/" : ""} ${n.name === ".env" ? "" : `<a class="vscode" href="${vs}">Apri in VS Code ↗</a>`}</div>
    <div class="tags">${layerTag(n.L)}${gitTag(n)}</div>
    <p class="lead">${n.s || ""}</p>`;

  if (n.d) h += `<h2>${isDir ? "Cosa contiene" : "Cosa fa"}</h2><p>${n.d}</p>`;
  if (n.it && n.it.length)
    h += `<h2>Elementi principali</h2><table class="items">${n.it.map(([k, v]) => `<tr><td><code>${k}</code></td><td>${v}</td></tr>`).join("")}</table>`;
  if (n.cmd) h += `<h2>Comando</h2><pre class="cmd">${n.cmd}</pre>`;

  if (isDir) {
    h += `<h2>Contenuto · ${n.children.length} elementi</h2>`;
    h += n.children.length
      ? `<div class="cards">${n.children.map(c => `<a class="card" href="#${c.path}"><span class="ico">${c.type === "dir" ? FOLDER_ICO : icon(c)}</span><div><b style="${c.g ? `color:var(--git-${c.g.toLowerCase()})` : c.ig ? "color:#8a8a8a" : ""}">${c.name}${c.type === "dir" ? "/" : ""}</b><span>${c.s || ""}</span></div></a>`).join("")}</div>`
      : `<p class="none">Cartella vuota.</p>`;
  } else {
    const deps = n.dep || [];
    h += `<h2>Dipende da</h2>` + (deps.length || (n.x && n.x.length)
      ? `<div class="chips">${deps.map(chip).join("")}${(n.x || []).map(x => `<span class="chip ext" title="Libreria esterna">📦 ${x}</span>`).join("")}</div>`
      : `<p class="none">Nessun modulo interno.</p>`);
    h += `<h2>Usato da</h2>` + (n.usedBy.length
      ? `<div class="chips">${n.usedBy.map(chip).join("")}</div>`
      : `<p class="none">Nessun modulo del progetto lo importa${n.L === "data" ? " (è un file di dati)" : ""}.</p>`);
  }
  if (n.n && n.n.length) h += `<h2>Da sapere</h2><div class="callout"><ul>${n.n.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  return h + `</div>`;
}

  web:   { fill: "#2e1b1e", stroke: "#e06c75" },
  ext:   { fill: "#232323", stroke: "#7a7a7a", dash: "4 3" },
};

function renderDiagram() {
  const N = Object.fromEntries(NODES.map(n => [n.id, { h: 46, ...n }]));
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let edges = "", labels = "";
  for (const e of EDGES) {
    const a = N[e.f], b = N[e.t];
    const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    let pts;
    if (e.via) {
      pts = e.via;
    } else {
      const dir = e.dir || (Math.abs(bc.x - ac.x) > Math.abs(bc.y - ac.y) ? "h" : "v");
      if (dir === "h") {
        const s = [bc.x > ac.x ? a.x + a.w : a.x, ac.y], t = [bc.x > ac.x ? b.x : b.x + b.w, bc.y], mx = (s[0] + t[0]) / 2;
        pts = [s, [mx, s[1]], [mx, t[1]], t];
      } else {
        const sx = a.bar ? bc.x : ac.x;
        const s = [sx, bc.y > ac.y ? a.y + a.h : a.y], t = [bc.x, bc.y > ac.y ? b.y : b.y + b.h], my = (s[1] + t[1]) / 2;
        pts = [s, [s[0], my], [t[0], my], t];
      }
    }
    const d = "M" + pts.map(p => p.join(" ")).join(" L");
    edges += `<path d="${d}" fill="none" stroke="#8b949e" stroke-width="1.3" ${e.dash ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#ah)" ${e.both ? 'marker-start="url(#ah)"' : ""}/>`;
    if (e.l) {
      let lp = e.lp;
      if (!lp) {
        const i = Math.floor((pts.length - 1) / 2), p1 = pts[i], p2 = pts[i + 1];
        lp = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
      }
      const halo = haloAt(lp[1]);
      labels += `<text x="${lp[0]}" y="${lp[1] + 3.5}" text-anchor="middle" font-size="10" fill="#b8b8b8" paint-order="stroke" stroke="${halo}" stroke-width="5" stroke-linejoin="round">${esc(e.l)}</text>`;
    }
  }
  let nodes = "";
  for (const n of Object.values(N)) {
    const k = KIND[n.k], cx = n.x + n.w / 2;
    const dash = k.dash || (n.dash ? "4 3" : "");
    const attrs = `fill="${k.fill}" stroke="${k.stroke}" stroke-width="1.5" ${dash ? `stroke-dasharray="${dash}"` : ""}`;
    let shape, ty, sy;
    if (n.cyl) {
      const ry = 7;
      shape = `<path d="M${n.x} ${n.y + ry} a${n.w / 2} ${ry} 0 0 0 ${n.w} 0 v${n.h - 2 * ry} a${n.w / 2} ${ry} 0 0 1 ${-n.w} 0 z" ${attrs}/>` +
              `<ellipse cx="${cx}" cy="${n.y + ry}" rx="${n.w / 2}" ry="${ry}" ${attrs}/>`;
      ty = n.y + n.h / 2 + 6; sy = ty + 14;
    } else {
      shape = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" ${attrs}/>`;
      ty = n.s ? n.y + n.h / 2 - 3 : n.y + n.h / 2 + 4; sy = ty + 14;
    }
    const title = n.p ? `<title>${n.p} — clicca per la spiegazione</title>` : "";
    const api = n.api ? `<g><rect x="${n.x + n.w - 24}" y="${n.y - 7}" width="28" height="14" rx="7" fill="#c2732a"/><text x="${n.x + n.w - 10}" y="${n.y + 3}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">API</text></g>` : "";
    nodes += `<g class="${n.p ? "n" : ""}" ${n.p ? `data-path="${n.p}"` : ""}>${title}${shape}` +
      `<text x="${cx}" y="${ty}" text-anchor="middle" style="font-family:var(--mono)" font-size="${n.bar ? 11.5 : n.cyl ? 10.5 : 11}" font-weight="600" fill="#ececec">${esc(n.t)}</text>` +
      (n.s ? `<text x="${cx}" y="${sy}" text-anchor="middle" font-size="10" fill="#a9a9a9">${esc(n.s)}</text>` : "") + api + `</g>`;
  }
  const bands = BANDS.map(b => `<rect x="8" y="${b.y}" width="984" height="${b.h}" rx="10" fill="${b.fill}" stroke="${b.stroke}"/>` +
    `<text x="24" y="${b.y + 23}" font-size="11" font-weight="700" letter-spacing=".06em" fill="${b.color}">${esc(b.title)}</text>` +
    `<text x="${b.sx}" y="${b.y + 23}" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">${esc(b.sub)}</text>`).join("");
  return `<svg viewBox="0 0 1000 1876" role="img" aria-label="Architettura di NetflixScout" style="font-family:var(--sans)">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
    ${bands}${edges}${nodes}${labels}
  </svg>`;
}

function renderOverview() {
  const L = (k, label) => `<span><i style="background:${KIND[k].fill};border-color:${KIND[k].stroke}${KIND[k].dash ? ";border-style:dashed" : ""}"></i>${label}</span>`;
  return `<div class="page" style="max-width:1120px">
    <h1><span style="color:#3794ff">◈</span>NetflixScout</h1>
    <div class="path">Mappa del progetto · grafico della struttura</div>
    <p class="lead">Assistente da terminale e da web (server FastAPI/SSE) che consiglia film con una pipeline RAG sul CMU Movie Summary Corpus (Qdrant per la ricerca, Cohere per il rerank, OpenAI per classificazione, segnali, embedding e risposta) risponde a domande su voti e classifiche con un database SQLite read-only di MovieLens 32M e recupera dati aggiornati (cast, regia, streaming, trailer, trending, serie) dall'API di TMDb e video su un film (interviste a regista e cast, making-of, dietro le quinte, commenti degli autori) dalla YouTube Data API; per informazioni enciclopediche (biografie, storia e produzione di un film, antologie, confronti con l'opera d'origine) legge Wikipedia a sezioni. Ogni tool vive in <code>tool/</code>; il database MovieLens resta in <code>movie_db/</code>.</p>
    <p style="color:var(--muted)">Clicca un riquadro del grafico, oppure un file o una cartella nell'explorer a sinistra, per leggerne la spiegazione.</p>
    <div class="diagram" id="diagram">${renderDiagram()}</div>
    <div class="legend">
      ${L("off", "Pipeline offline")}${L("rt", "Runtime RAG")}${L("orch", "Orchestrazione / guardrail")}${L("out", "Output / presenter")}${L("cinema", "cinema_sql + build")}${L("tmdb", "Tool TMDb")}${L("youtube", "Tool YouTube")}${L("wikipedia", "Tool Wikipedia")}${L("omdb", "Tool OMDb")}${L("tvmaze", "Tool TVmaze")}${L("wikidata", "Tool Wikidata")}${L("web", "Server web / liste")}${L("entry", "Entry point")}${L("data", "Dati locali")}${L("ext", "Esterno / non è un file")}
      <span><i style="background:#c2732a;border-color:#c2732a;border-radius:7px"></i>chiama un'API a pagamento</span>
    </div>

    <h2>Il flusso in 12 passi</h2>
    <ol class="steps">
      <li><b>Pipeline offline (una volta sola, non fanno parte dell'agente).</b> <a class="vscode" href="#pipelines/wikipedia_films">pipelines/wikipedia_films</a> e <a class="vscode" href="#pipelines/wikipedia_series">pipelines/wikipedia_series</a> trasformano il dump di Wikipedia italiana e Wikidata in cataloghi puliti, ne calcolano gli embedding (<code>text-embedding-3-large</code>, 1.536 dimensioni, a pagamento) e li scrivono in Qdrant: <code>wikipedia_films_it_v3</code> e <code>wikipedia_series_it_v1</code>. Il database <code>cinema_db</code> si costruisce a parte, offline (vedi il passo 6). L'applicazione legge soltanto, non scrive mai.</li>
      <li><b>Guardrail.</b> <a class="vscode" href="#app.py">app.py</a> riceve la domanda e <a class="vscode" href="#query_classifier/query_classifier.py">query_classifier</a> (gpt-4o-mini) blocca quelle che non riguardano il cinema, rispondendo con una riga secca nella lingua dell'utente (la scrive il classificatore stesso; ripiego fisso it/en/de) e senza mostrare stadi, storia o riquadro. Vede anche l'ultimo scambio della conversazione (<code>classifier_context_messages</code>), così un follow-up come “ne puoi trovare 3 più recenti?” non viene scambiato per off-topic; giudica comunque solo l'ultima domanda. Restituisce anche la lingua del turno (solo l'ultimo messaggio conta).</li>
      <li><b>Orchestrazione.</b> <a class="vscode" href="#orchestrator.py">orchestrator.py</a>, con una chiamata LLM, riscrive i follow-up in una query autonoma usando la history e sceglie il tool tra i nove registrati: <code>rag_search</code> (film per trama, temi, atmosfera, anche con titoli, persone, anni o paesi; è anche il fallback), <code>series_rag_search</code> (serie, stagioni, episodi, film TV), <code>cinema_sql</code> (dati strutturati, filmografie, premi, classifiche e voti MovieLens), <code>tmdb_search</code>, <code>youtube_search</code>, <code>wikipedia_search</code>, <code>omdb_search</code>, <code>tvmaze_search</code>, <code>wikidata_search</code>. Le regole di routing sono nel prompt, insieme al catalogo dei tool con i loro schemi (<a class="vscode" href="#planner_rules_v4.py">planner_rules_v4.py</a> per i sistemi locali). Una richiesta composta elenca le sue parti e i tool le eseguono in sequenza nello stesso turno, ognuno con i dati dei precedenti, fino a <code>max_tool_calls_per_turn</code>. Le impostazioni utente (<a class="vscode" href="#preferences">preferences/</a>, solo web) prevalgono sulla richiesta e una guardia deterministica blocca i tool incompatibili con il tipo di contenuto.</li>
      <li><b>RAG film (<code>rag_search</code>).</b> Il planner passa la richiesta intera; <a class="vscode" href="#tool/rag/film/retrieval/parser.py">parser.py</a> (una chiamata LLM) ne ricava i segnali (cosa si vuole, film e franchise da escludere, tratti da evitare, generi, anni, paesi, registi, attori); <a class="vscode" href="#tool/rag/film/retrieval/search.py">search.py</a> cerca nell'unico indice denso con filtri lato Qdrant, un K largo di al massimo 50 candidati, esclusioni e penalità semantica; <a class="vscode" href="#tool/rag/film/retrieval/service.py">service.py</a> (l'unico modulo che parla con OpenAI) riordina i primi 40 con <code>gpt-5.6-sol</code>. Nessun BM25, nessuna fusione, nessun ripiego su altri indici. Poi <a class="vscode" href="#tool/tmdb/enrich.py">tmdb/enrich.py</a> aggiunge locandina e id TMDb dei soli film restituiti, con una <code>/find</code> per IMDb id (mai per titolo).</li>
      <li><b>RAG serie (<code>series_rag_search</code>).</b> <a class="vscode" href="#tool/rag/series/tool.py">series/tool.py</a> segue lo stesso schema sulla collezione delle serie: un parser ricava livello (serie, stagione, episodio, film TV), serie nominata, filtri ed esclusioni; la ricerca densa ha il livello obbligatorio; un LLM riordina. Nessuna richiesta HTTP a terzi. Un risultato vuoto offre un solo passo verso TMDb o TVmaze. Acceso di default, <code>SERIES_RAG_ENABLED=0</code> lo spegne.</li>
      <li><b>Database locale (<code>cinema_sql</code>) e MovieLens.</b> <a class="vscode" href="#tool/cinema_db/tool.py">cinema_db/tool.py</a> valida un'operazione (16: <code>find_work</code>, <code>filmography</code>, <code>awards</code>, <code>movielens</code>, <code>sql</code>…), la traduce in SQL costante e la esegue, in sola lettura, sulle viste approvate del file <code>cinema_db/data/cinema.v4.candidate6.sqlite3</code> (validatore sqlglot, connessione <code>mode=ro</code>, authorizer con negazione predefinita, <a class="vscode" href="#tool/cinema_db/executor.py">executor.py</a>). <b>MovieLens non è un tool</b>: i suoi film, generi e tag sono stati copiati dentro quel file dalla build offline (<a class="vscode" href="#cinema_db/harness/build/movielens_layer.py">movielens_layer.py</a>, che legge <a class="vscode" href="#movie_db/data">movie_db/data</a>), e le classifiche e i voti degli utenti sono l'operazione <code>movielens</code>. A runtime il file MovieLens originale non viene mai aperto. Nessuna rete, nessuna chiave.</li>
      <li><b>Tool TMDb.</b> <a class="vscode" href="#${T}tool.py">tmdb/tool.py</a> valida le <code>requests</code> del planner (<a class="vscode" href="#${T}models/requests.py">TmdbToolInput</a>, 1–4 operazioni) prima di qualunque chiamata, risolve gli ID mancanti e chiama endpoint fissi tramite <a class="vscode" href="#${T}http.py">http.py</a>, l'unico punto di I/O: memo del turno, cache TTL, pausa dopo un 429 e al massimo <code>max_calls_per_turn = 10</code> tentativi, senza retry. <a class="vscode" href="#${T}prompt_budget.py">prompt_budget.py</a> limita i dati passati all'LLM.</li>
      <li><b>Tool YouTube e Wikipedia.</b> <a class="vscode" href="#${Y}tool.py">youtube/tool.py</a> fa una <code>search.list</code> per categoria (al massimo 2 per turno), una sola <code>videos.list</code> e filtra con <a class="vscode" href="#${Y}relevance.py">relevance.py</a> senza riordinare: i video incerti restano “da verificare”. <a class="vscode" href="#${W}tool.py">wikipedia/tool.py</a> interroga <b>una sola edizione</b> (inglese per default; l'italiano o il tedesco solo se il planner lo chiede in un passo successivo), scarica l'articolo una volta e consegna le <a class="vscode" href="#${W}sections.py">sezioni</a> che servono fino al budget di contesto, offrendo <code>follow_up</code> su cosa è stato letto e cosa no.</li>
      <li><b>Tool OMDb, TVmaze e Wikidata.</b> <a class="vscode" href="#${O}tool.py">omdb/tool.py</a> identifica l'opera (mai per solo titolo se c'è dubbio) e restituisce i punteggi IMDb, Metascore e Rotten Tomatoes con il loro stato, senza cache. <a class="vscode" href="#${TV}tool.py">tvmaze/tool.py</a> dà i dati strutturati di UNA serie: stato, rete, cast, stagioni, episodi, prossimo episodio. <a class="vscode" href="#${WD}tool.py">wikidata/tool.py</a> distingue le opere omonime e legge le relazioni dichiarate (fonte, remake, serie, franchise) con query SPARQL predefinite. Tutti e tre hanno un budget di richieste per turno, nessun retry e un solo punto di I/O (<code>http.py</code>); OMDb usa una chiave, gli altri due no.</li>
      <li><b>Risposta.</b> L'orchestratore scrive la risposta usando solo i dati ricevuti, con le regole dei tool usati (<code>tool_final_instructions</code>), in UNA chiamata in streaming: il testo arriva al canale mentre viene scritto. Oltre <code>memory_window_size</code> (12) messaggi <a class="vscode" href="#conversation.py">conversation.py</a> compatta la history.</li>
      <li><b>Output.</b> <code>handle_query</code> in <a class="vscode" href="#app.py">app.py</a> non stampa nulla: impacchetta risposta e passaggi in un <a class="vscode" href="#turn.py">TurnResult</a>. Poi <a class="vscode" href="#presenters">presenters/</a> lo mostra in base al canale dichiarato dall'entry point. Il procedimento è raccontato <b>mentre accade</b> (l'orchestratore emette gli step a un <code>TurnObserver</code>): poche frasi semplici, poi il blocco di dettaglio di ogni tool (le tre fasi del RAG, le query SQL eseguite da <code>cinema_sql</code>, le chiamate HTTP con gli URL mascherati, fonti e licenze), poi la risposta. Il web riceve la stessa storia e gli stessi dati in JSON e dal vivo come eventi (<a class="vscode" href="#presenters/web/observer.py">WebObserver</a>), costruiti dalle stesse viste condivise.</li>
      <li><b>Server web.</b> <a class="vscode" href="#web_api/server.py">web_api/</a> espone il bot al frontend: <code>POST /conversations/{id}/messages</code> risponde con uno stream SSE (<code>turn_start</code>, <code>status</code>, <code>story</code>, <code>step</code>, <code>answer_delta</code>, <code>answer_end</code>, <code>lists</code>, <code>done</code>). Il turno gira in un thread di proprietà del server (<a class="vscode" href="#web_api/streaming/runner.py">runner.py</a>): la history si registra quando <code>handle_query</code> ritorna anche se il client è sparito. La stessa chiamata della risposta restituisce anche i riferimenti alle liste, che <a class="vscode" href="#web_lists/attach_lists.py">web_lists/</a> controlla e idrata con i dati dei tool, senza altre chiamate.</li>
    </ol>

    <h2>Punti di attenzione nel codice</h2>
    <div class="callout"><ul>
      <li><b>MovieLens non è un tool.</b> Il vecchio <code>movie_db_search</code> è stato eliminato il 2026-11-16. I dati (87.585 film, 32 milioni di voti, 2 milioni di tag) entrano in <code>cinema_db</code> solo con la build offline; a runtime le classifiche e i voti sono l'operazione <code>movielens</code> di <code>cinema_sql</code>. Il file originale (<code>movie_db/data/</code>, ~1,3 GB, ignorato da git) serve soltanto a ricostruire il database. Popolazioni: <code>genre_stats</code> solo film, <code>ratings</code> senza <code>type</code> comprende film e serie.</li>
      <li><b>Cosa è acceso di default</b> (dalla FASE 24): <code>cinema_sql</code> e <code>series_rag_search</code>. <code>CINEMA_DB_ENABLED=0</code> e <code>SERIES_RAG_ENABLED=0</code> li spengono uno per uno; con entrambi spenti restano il RAG dei film e i tool esterni. Il vecchio RAG (CMU 2012, Cohere, BM25, catalogo TMDb) è stato eliminato il 2026-11-09 e non esiste rollback.</li>
      <li>Tool YouTube: la verifica end-to-end dopo i fix di pertinenza, i casi YouTube del routing eval live e la privacy policy richiesta dalle Developer Policies (III.A.2) sono ancora da fare. Quota: 100 <code>search.list</code> al giorno per progetto.</li>
      <li>Tool Wikidata: smoke test live del 2026-10-29 fatto (8 richieste), ma il routing eval live dei suoi casi e un E2E con LLM reale non sono mai stati eseguiti. Tool TVmaze: 16 domande reali il 2026-10-29; limiti noti su omonimi, qualificatori tra parentesi e speciali. Tool OMDb: smoke test del 2026-10-28; i testi d'errore di quota e chiave non sono stati osservati.</li>
      <li>Le regole sulle affermazioni non supportate, sul non nominare le fonti e sul trattare il testo di terzi come dato sono istruzioni per il modello: non dimostrabili offline, osservate solo su campioni piccoli.</li>
      <li>Server web: nessuna autenticazione né rate limit, per scelta; un solo worker (conversazioni in memoria). Lo streaming strutturato (<code>answer</code> prima di <code>lists</code>) non è dimostrato sul modello reale: lo controlla <code>web_api/harness/live_stream_check.py</code> (1 chiamata, con permesso). La selezione dei riferimenti delle liste non comprende la semantica: scarta solo per segnali di negazione o confronto.</li>
    </ul></div>
  </div>`;
}

contentEl.addEventListener("click", ev => {
  const g = ev.target.closest("#diagram [data-path]");
  if (g) go(g.dataset.path);
});

/* Status bar */
(() => {
  let m = 0, u = 0;
  BY_PATH.forEach(n => { if (n.type === "file" && n.g === "M") m++; if (n.type === "file" && n.g === "U") u++; });
  document.getElementById("git-count").textContent = `● ${m} modificati   ＋ ${u} nuovi`;
})();

open(decodeURIComponent(location.hash.slice(1)));
</script>
