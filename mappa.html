<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetflixScout — Mappa del progetto</title>
<style>
  :root {
    --bg: #1e1e1e;
    --sidebar: #181818;
    --activity: #181818;
    --border: #2b2b2b;
    --tab-bg: #181818;
    --tab-active: #1f1f1f;
    --text: #cccccc;
    --muted: #8b8b8b;
    --accent: #0078d4;
    --hover: #2a2d2e;
    --selected: #04395e;
    --git-m: #e2c08d;
    --git-u: #73c991;
    --ignored: #6e6e6e;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-rows: 30px 1fr 22px; height: 100vh; }
  .titlebar { background: #181818; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); position: relative; }
  .titlebar .dots { position: absolute; left: 12px; display: flex; gap: 8px; }
  .titlebar .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .workbench { display: grid; grid-template-columns: 48px var(--side-w, 280px) 4px 1fr; min-height: 0; }

  /* Activity bar */
  .activity { background: var(--activity); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .activity button { width: 48px; height: 48px; background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; place-items: center; border-left: 2px solid transparent; }
  .activity button.on { color: #fff; border-left-color: var(--accent); }
  .activity button:hover { color: #fff; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .side-title { height: 35px; display: flex; align-items: center; padding: 0 20px; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .section-head { display: flex; align-items: center; height: 22px; padding: 0 8px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; cursor: default; }
  .section-head .chev { width: 16px; display: grid; place-items: center; }
  .section-head .actions { margin-left: auto; display: flex; gap: 2px; }
  .section-head .actions button { background: none; border: 0; color: var(--text); cursor: pointer; width: 22px; height: 20px; border-radius: 4px; display: grid; place-items: center; }
  .section-head .actions button:hover { background: #ffffff1a; }
  .tree { overflow: auto; flex: 1; padding-bottom: 24px; outline: none; }
  .sash { cursor: col-resize; background: transparent; }
  .sash:hover, .sash.drag { background: var(--accent); }

  .row { height: 22px; display: flex; align-items: center; padding-left: calc(var(--d) * 12px + 6px); padding-right: 10px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; position: relative; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--selected); border-color: var(--accent); }
  .row .twist { width: 16px; flex: none; display: grid; place-items: center; color: var(--text); }
  .row .twist svg { transition: transform .1s; }
  .node.open > .row .twist svg { transform: rotate(90deg); }
  .row .ico { width: 16px; flex: none; margin-right: 6px; display: grid; place-items: center; font: 600 10px/1 var(--mono); }
  .row .label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .badge { font: 11px var(--mono); margin-left: 8px; }
  .row.g-M .label, .row.g-M .badge { color: var(--git-m); }
  .row.g-U .label, .row.g-U .badge { color: var(--git-u); }
  .row.ig .label { color: var(--ignored); }
  .row.has-M .label { color: var(--git-m); }
  .row.has-U .label { color: var(--git-u); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 8px; }
  .children { display: none; position: relative; }
  .node.open > .children { display: block; }
  .children::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--d) * 12px + 14px); border-left: 1px solid #585858; opacity: 0; transition: opacity .15s; z-index: 1; pointer-events: none; }
  .tree:hover .children::before { opacity: .45; }

  /* Editor */
  .editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .tabs { display: flex; background: var(--tab-bg); border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 6px; height: 35px; padding: 0 8px 0 12px; border-right: 1px solid var(--border); cursor: pointer; color: var(--muted); white-space: nowrap; border-top: 1px solid transparent; }
  .tab.on { background: var(--tab-active); color: #fff; border-top-color: var(--accent); }
  .tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; visibility: hidden; color: var(--text); }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab .x:hover { background: #ffffff1a; }
  .tab .ico { font: 600 10px/1 var(--mono); width: 16px; display: grid; place-items: center; }
  .crumbs { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 16px; color: var(--muted); font-size: 12px; flex: none; border-bottom: 1px solid #ffffff08; }
  .crumbs a:hover { color: #fff; }
  .crumbs .sep { opacity: .6; }
  .content { overflow: auto; flex: 1; }
  .page { max-width: 980px; padding: 28px 40px 60px; }

  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; color: #fff; display: flex; align-items: center; gap: 10px; }
  h1 .ico { font: 700 13px/1 var(--mono); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 10px; font-weight: 600; }
  p { margin: 0 0 12px; max-width: 78ch; }
  code { font: 12px var(--mono); background: #ffffff12; padding: 1px 5px; border-radius: 4px; color: #d7ba7d; }
  .lead { font-size: 15px; color: #e6e6e6; margin: 10px 0 18px; }
  .path { font: 12px var(--mono); color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; align-items: center; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
  .vscode { font-size: 12px; color: #3794ff; margin-left: 4px; }
  .vscode:hover { text-decoration: underline; }

  table.items { border-collapse: collapse; width: 100%; }
  table.items td { padding: 7px 12px 7px 0; border-bottom: 1px solid #ffffff0d; vertical-align: top; }
  table.items td:first-child { white-space: nowrap; width: 1%; padding-right: 20px; }
  table.items td:first-child code { color: #dcdcaa; background: none; padding: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 4px; background: #ffffff0d; border: 1px solid #ffffff14; font: 12px var(--mono); }
  .chip:hover { background: #ffffff1a; border-color: #ffffff30; }
  .chip.ext { color: var(--muted); }
  .none { color: var(--muted); font-style: italic; }

  .callout { border-left: 3px solid #cca700; background: #cca70012; padding: 10px 14px; border-radius: 0 4px 4px 0; }
  .callout ul { margin: 0; padding-left: 18px; }
  .callout li { margin: 3px 0; }
  pre.cmd { font: 12px/1.6 var(--mono); background: #0d0d0d; border: 1px solid #ffffff12; border-radius: 6px; padding: 10px 14px; overflow-x: auto; color: #9cdcfe; margin: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .card { display: flex; gap: 10px; padding: 10px 12px; border-radius: 6px; background: #ffffff08; border: 1px solid #ffffff10; }
  .card:hover { background: #ffffff12; border-color: #ffffff28; }
  .card .ico { font: 600 10px/1 var(--mono); width: 16px; margin-top: 3px; flex: none; text-align: center; }
  .card b { font: 600 12.5px var(--mono); color: #e6e6e6; display: block; }
  .card span { font-size: 12px; color: var(--muted); }

  /* Diagram */
  .diagram { background: #181818; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .diagram .n { cursor: pointer; }
  .diagram .n:hover rect, .diagram .n:hover path, .diagram .n:hover ellipse { filter: brightness(1.45); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1.5px solid; }
  ol.steps { padding-left: 20px; max-width: 80ch; }
  ol.steps li { margin: 6px 0; }

  .statusbar { background: var(--accent); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 10px; font-size: 12px; }
  .statusbar .r { margin-left: auto; display: flex; gap: 16px; }

  @media (max-width: 760px) {
    .workbench { grid-template-columns: 0 220px 0 1fr; }
    .activity { display: none; }
    .page { padding: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <span id="title">NetflixScout — Mappa del progetto</span>
  </div>

  <div class="workbench" id="workbench">
    <nav class="activity">
      <button class="on" title="Esplora risorse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v12"/><path d="M9 7h8l3 3v9a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button title="Panoramica (grafico)" id="act-overview">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="6" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M6.5 9v3h11V9M12 12v3"/></svg>
      </button>
    </nav>

    <aside class="sidebar">
      <div class="side-title">EXPLORER</div>
      <div class="section-head">
        <span class="chev"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span>
        NETFLIXSCOUT
        <span class="actions">
          <button id="btn-overview" title="Panoramica (grafico)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="5" height="4" rx=".5"/><rect x="9" y="2" width="5" height="4" rx=".5"/><rect x="5.5" y="10" width="5" height="4" rx=".5"/><path d="M4.5 6v2h7V6M8 8v2"/></svg></button>
          <button id="btn-collapse" title="Comprimi cartelle"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4.5" y="4.5" width="9" height="9" rx="1"/><path d="M2.5 11V3.5a1 1 0 0 1 1-1H11M7 9h4"/></svg></button>
        </span>
      </div>
      <div class="tree" id="tree" tabindex="0"></div>
    </aside>
    <div class="sash" id="sash"></div>

    <main class="editor">
      <div class="tabs" id="tabs"></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <footer class="statusbar">
    <span>⎇ main*</span>
    <span id="git-count"></span>
    <span class="r"><span>Python 3.11 (.venv)</span><span>ChromaDB</span><span>UTF-8</span></span>
  </footer>
</div>

<script>
/* ======================================================================
   Percorso assoluto usato dal link "Apri in VS Code" (vscode://file/...).
   ====================================================================== */
const ROOT_ABS = "/Users/filippo.milzagmail.com/Desktop/NetflixScout";

const Q = "rag/FromQueryEmbeddingToRes/";
const E = "rag/EmbeddingProcess/";

const LAYERS = {
  entry:  { label: "Entry point",            color: "#b48cff" },
  orch:   { label: "Orchestrazione",         color: "#ff7eb6" },
  off:    { label: "Indicizzazione offline", color: "#2bb3a0" },
  rt:     { label: "Runtime RAG",            color: "#4a9eff" },
  data:   { label: "Dati locali",            color: "#e0a43a" },
  cfg:    { label: "Config / docs",          color: "#9da5b4" },
  out:    { label: "Output / presenter",     color: "#56d4dd" },
  test:   { label: "Test",                   color: "#73c991" },
};

const F = (name, info = {}) => ({ type: "file", name, ...info });
const D = (name, info = {}, children = []) => ({ type: "dir", name, children, ...info });

/* ---------- File generati da ChromaDB (riusati in ogni cartella del DB) ---------- */
const SQLITE = {
  L: "data", ig: true,
  s: "Database SQLite di Chroma: documenti, metadati e definizione delle collection.",
  d: `File principale di un <code>chromadb.PersistentClient</code>. Contiene il testo dei chunk, i metadati (<code>title</code>, <code>release_year</code>, <code>genres</code>, <code>cast</code>, …), gli id e la configurazione della collection (<code>hnsw:space = cosine</code>). I vettori veri e propri stanno nella sottocartella con nome UUID.`,
  n: ["Non va modificato a mano: si rigenera con <code>python buildSemanticDb.py</code>."],
};
const BIN = {
  "data_level0.bin": "I vettori di embedding e il livello 0 del grafo HNSW (la parte più grande dell'indice).",
  "header.bin": "Intestazione dell'indice hnswlib: dimensione dei vettori, parametri M/ef, numero di elementi.",
  "length.bin": "Metadati di servizio di hnswlib sulle lunghezze dei record.",
  "link_lists.bin": "Collegamenti dei livelli superiori del grafo HNSW (servono per navigare velocemente verso i vicini).",
  "index_metadata.pickle": "Mappa id ↔ posizione nell'indice salvata da Chroma (formato pickle).",
};
function segment(uuid, files) {
  return D(uuid, {
    L: "data", ig: true,
    s: "Segmento vettoriale HNSW della collection (nome = UUID generato da Chroma).",
    d: `Contiene l'indice di ricerca approssimata dei vicini (HNSW, libreria <code>hnswlib</code>) su cui Chroma esegue <code>collection.query(query_embeddings=…)</code>. Il nome della cartella è l'id interno del segmento.`,
  }, files.map(f => F(f, { L: "data", ig: true, s: BIN[f], d: BIN[f] + " File binario generato automaticamente: non si apre e non si modifica." })));
}
function chromaDir(name, uuid, files, info) {
  return D(name, { L: "data", ig: true, ...info }, [F("chroma.sqlite3", SQLITE), segment(uuid, files)]);
}
const BINS4 = ["data_level0.bin", "header.bin", "length.bin", "link_lists.bin"];
const BINS5 = ["data_level0.bin", "header.bin", "index_metadata.pickle", "length.bin", "link_lists.bin"];
const DIAG_NOTE = "Cartella di diagnostica creata durante il debug della validazione dei metadati a batch. Il codice non la usa (legge solo <code>openai/</code> e <code>local/</code>): si può cancellare.";

/* ====================================================================== */
const TREE = D("NetflixScout", {}, [

  D(".venv", {
    L: "cfg", ig: true,
    s: "Virtualenv Python 3.11 con le dipendenze installate.",
    d: `Ambiente isolato creato con <code>python3.11 -m venv .venv</code>. Contiene l'interprete e i pacchetti di <code>requirements.txt</code> (più <code>pytest</code>). È ignorato da git e non va mai committato.`,
    cmd: "source .venv/bin/activate\npip install -r requirements.txt pytest",
  }),

  D("dataset", {
    L: "data", ig: true,
    s: "Corpus di input: CMU Movie Summary Corpus (non versionato).",
    d: `È la sorgente da cui <code>buildSemanticDb.py</code> costruisce il database vettoriale. Va scaricato a mano da <a class="vscode" href="https://www.cs.cmu.edu/~ark/personas/" target="_blank" rel="noopener">cs.cmu.edu/~ark/personas</a>. Il builder scorre tutti i file in ordine alfabetico: le trame passano da <code>movie_metadata.py</code>, i file <code>.tsv</code> sono saltati (vengono letti solo come metadati), gli altri formati passano dai <code>loaders/</code>.`,
  }, [
    D("MovieSummaries", {
      L: "data", ig: true,
      s: "I file originali del corpus CMU (trame di Wikipedia + metadati Freebase).",
      d: `Circa 42.000 trame di film estratte da Wikipedia, unite ai metadati di circa 81.000 film presi da Freebase. Il join avviene sul <code>wikipedia_movie_id</code>.`,
    }, [
      F("README.txt", { L: "data", ig: true, s: "Descrizione ufficiale del corpus e del formato delle colonne.", d: `Documentazione degli autori del dataset. Il builder lo tratta come un normale <code>.txt</code>: passa dal loader, da <code>clean.py</code> e da <code>chunk_semantic</code>, quindi finisce anche lui nel DB come chunk con <code>source = MovieSummaries/README.txt</code>.`, n: ["Questi chunk non hanno titolo, anno e generi: possono comparire nei risultati come rumore."] }),
      F("character.metadata.tsv", { L: "data", ig: true, s: "Personaggi e attori di ogni film.", d: `Una riga per personaggio: id del film, nome del personaggio, attore, genere, età. <code>load_cast_by_movie()</code> lo usa per costruire il campo <code>cast</code> dei metadati.` }),
      F("movie.metadata.tsv", { L: "data", ig: true, s: "Metadati dei film: titolo, data di uscita, lingue, paesi, generi.", d: `Letto da <code>load_movie_metadata()</code>. Colonne come lingue, paesi e generi sono dizionari Freebase serializzati in JSON (<code>{"/m/02h40lc": "English Language"}</code>) che vengono normalizzati in stringhe leggibili.` }),
      F("name.clusters.txt", { L: "data", ig: true, s: "Cluster di nomi di personaggi (non usato dall'app).", d: `Raggruppa i personaggi che sono la stessa entità in film diversi. NetflixScout non lo usa per i metadati, ma essendo un <code>.txt</code> viene comunque indicizzato come testo generico.` }),
      F("plot_summaries.txt", { L: "data", ig: true, s: "Il cuore del corpus: una trama per riga (id\\ttrama).", d: `Formato <code>wikipedia_movie_id&lt;TAB&gt;trama</code>. Ha un percorso dedicato nel builder: <code>iter_plot_rows()</code> unisce ogni trama ai metadati e al cast, e ogni trama diventa <b>un solo chunk</b>, senza pulizia né chunking semantico.` }),
      F("tvtropes.clusters.txt", { L: "data", ig: true, s: "Personaggi classificati per tropo di TV Tropes (non usato dall'app).", d: `Personaggi annotati con 72 tropi (es. <i>dumb muscle</i>). Come gli altri <code>.txt</code> finisce nel DB come testo generico.` }),
    ]),
  ]),

  D("dbVettoriale", {
    L: "data", ig: true,
    s: "Database vettoriale Chroma persistente, una sottocartella per backend di embedding.",
    d: `<code>vectorstore.DB_ROOT</code> punta qui. A runtime <code>runtime._resolve_runtime_config</code> sceglie <code>openai/</code> o <code>local/</code>: se ne esiste una sola usa quella, altrimenti segue <code>CONFIG["rag"]["embedding"]["backend"]</code>. La collection si chiama <code>netflix_scout</code>.`,
    n: ["La query va embeddata con lo stesso backend e modello usati per costruire il DB, altrimenti i risultati non hanno senso.", "Le cartelle <code>diag_*</code> e <code>test_*</code> sono residui di debug."],
  }, [
    chromaDir("openai", "ccd8ca3a-7582-4c5a-8a88-305387ceebcc", BINS5, { s: "DB costruito con embedding OpenAI text-embedding-3-small (backend di default).", d: `Generato da <code>python buildSemanticDb.py --embedding-backend openai</code>. È il DB che usa l'app con la configurazione attuale.` }),
    chromaDir("local", "ab13cb76-df1d-42d3-af67-7f60f102b828", BINS5, { s: "DB costruito con embedding locali (sentence-transformers).", d: `Generato da <code>python buildSemanticDb.py --embedding-backend local --embedding-model &lt;modello HF&gt;</code>. Non richiede chiamate a OpenAI per gli embedding.` }),
    chromaDir("diag_metadata_batch", "9e7ec721-7943-4bfe-a11c-24adcb6fc939", BINS4, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("diag_metadata_batch2", "93be12ac-ec64-4712-a51c-50d086cda8a3", BINS5, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("diag_metadata_batch_fixed", "0305a07c-6617-43b2-8ae4-82fc2cc0ec4b", BINS5, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("test_metadata_batch", "db1416b5-bc32-474d-866d-0d34d1d52ef5", BINS4, { s: "Residuo di test (validazione metadati).", d: DIAG_NOTE }),
  ]),

  D("rag", {
    L: "rt",
    s: "Il package Python con tutta la logica RAG, divisa in due fasi.",
    d: `<b>EmbeddingProcess/</b> è la fase offline (documenti → chunk → vettori → DB). <b>FromQueryEmbeddingToRes/</b> è la fase a runtime (query → retrieval → rerank → evidenze per l'orchestratore). Le due fasi condividono <code>embeddings.py</code> e <code>vectorstore.py</code>, che stanno nella cartella runtime.`,
  }, [
    F("__init__.py", { L: "rt", s: "Marca <code>rag</code> come package (contiene solo una docstring).", d: `File vuoto a parte la docstring <code>"RAG package root."</code>. Serve per poter scrivere import assoluti come <code>from rag.FromQueryEmbeddingToRes import …</code> dalla root del repo.` }),

    D("EmbeddingProcess", {
      L: "off",
      s: "Pipeline offline: carica, pulisce, spezza in chunk e indicizza i documenti.",
      d: `Viene eseguita solo da <code>buildSemanticDb.py</code>, mai durante la chat. Flusso: <code>loaders/</code> → <code>clean.py</code> → <code>chunk.py</code> → <code>embeddings.embed</code> → <code>vectorstore.indicizza</code>. Le trame dei film seguono un percorso dedicato via <code>movie_metadata.py</code>.`,
    }, [

  (a.type === b.type ? 0 : a.type === "dir" ? -1 : 1) ||
  a.name.localeCompare(b.name, undefined, { sensitivity: "base" });

(function index(node, parent) {
  node.path = parent === null ? "" : (parent ? parent + "/" : "") + node.name;
  node.parentPath = parent;
  if (node.path) BY_PATH.set(node.path, node);
  if (node.children) {
    node.children.sort(sortKids);
    node.children.forEach(c => index(c, node.path));
  }
})(TREE, null);

  const s = new Set(n.g ? [n.g] : []);
  n.children.forEach(c => gitInside(c).forEach(v => s.add(v)));
  n.gitInside = s;
  return s;
}

function icon(n) {
  if (n.type === "dir") return "";
  const name = n.name;
  const ext = name.includes(".") ? name.slice(name.lastIndexOf(".") + 1).toLowerCase() : "";
  if (ext === "py") return PY;

const treeEl = document.getElementById("tree");

const OPEN_DEFAULT = new Set(["rag", "rag/FromQueryEmbeddingToRes"]);

function buildNode(n, depth) {
  const wrap = document.createElement("div");
  wrap.className = "node" + (OPEN_DEFAULT.has(n.path) ? " open" : "");
  const row = document.createElement("div");
  row.className = "row";
  row.style.setProperty("--d", depth);
  row.dataset.path = n.path;
  row.title = n.path;
  if (n.g) row.classList.add("g-" + n.g);
  if (n.ig) row.classList.add("ig");
  let badge = n.g ? `<span class="badge">${n.g}</span>` : "";
  if (n.type === "dir" && !n.g && n.gitInside && n.gitInside.size) {
    const k = n.gitInside.has("M") ? "M" : "U";
    row.classList.add("has-" + k);
    badge = `<span class="dot" style="background:var(--git-${k.toLowerCase()})"></span>`;
  }
  row.innerHTML =
    `<span class="twist">${n.type === "dir" ? CHEV : ""}</span>` +
    `<span class="ico">${icon(n)}</span>` +
    `<span class="label">${n.name}</span>${badge}`;
  wrap.appendChild(row);
  WRAP.set(n.path, wrap);
  if (n.type === "dir") {
    const kids = document.createElement("div");
    kids.className = "children";
    kids.style.setProperty("--d", depth);
    n.children.forEach(c => kids.appendChild(buildNode(c, depth + 1)));
    wrap.appendChild(kids);
  }
  return wrap;
}
TREE.children.forEach(c => treeEl.appendChild(buildNode(c, 0)));

treeEl.addEventListener("click", ev => {
  const row = ev.target.closest(".row");
  if (!row) return;
  const n = BY_PATH.get(row.dataset.path);
  if (n.type === "dir") {
    const wrap = WRAP.get(n.path);
    const wasActive = state.active === n.path;
    // Come VS Code: il click apre/chiude; in più mostra la pagina della cartella
    if (wasActive || !wrap.classList.contains("open")) wrap.classList.toggle("open");
  }
  go(n.path);
});

function reveal(path) {
  const parts = path.split("/");
  for (let i = 1; i < parts.length; i++) {
    const w = WRAP.get(parts.slice(0, i).join("/"));
    if (w) w.classList.add("open");
  }
  treeEl.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  const w = WRAP.get(path);
  if (w) {
    const row = w.querySelector(":scope > .row");
    row.classList.add("active");
    const tr = treeEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
    if (rr.top < tr.top || rr.bottom > tr.bottom) row.scrollIntoView({ block: "center" });
  }
}

/* Tastiera: frecce su/giù, destra/sinistra per aprire/chiudere */
treeEl.addEventListener("keydown", ev => {
  const rows = [...treeEl.querySelectorAll(".row")].filter(r => r.offsetParent !== null);
  let i = rows.findIndex(r => r.classList.contains("active"));
  const cur = rows[i] && BY_PATH.get(rows[i].dataset.path);
  if (ev.key === "ArrowDown") i = Math.min(rows.length - 1, i + 1);
  else if (ev.key === "ArrowUp") i = Math.max(0, i - 1);
  else if (ev.key === "ArrowRight" && cur && cur.type === "dir") { WRAP.get(cur.path).classList.add("open"); ev.preventDefault(); return; }
  else if (ev.key === "ArrowLeft" && cur) {
    if (cur.type === "dir" && WRAP.get(cur.path).classList.contains("open")) WRAP.get(cur.path).classList.remove("open");
    else if (cur.parentPath) go(cur.parentPath);
    ev.preventDefault(); return;
  } else return;
  ev.preventDefault();
  if (rows[i]) go(rows[i].dataset.path);
});

const state = { tabs: [""], active: "" };
const tabsEl = document.getElementById("tabs");
const crumbsEl = document.getElementById("crumbs");
const contentEl = document.getElementById("content");

function go(path) {
  if (("#" + path) !== location.hash && !(path === "" && (location.hash === "" || location.hash === "#"))) {
    location.hash = path;           // hashchange → open()
  } else open(path);
}
addEventListener("hashchange", () => open(decodeURIComponent(location.hash.slice(1))));

function open(path) {
  if (path && !BY_PATH.has(path)) path = "";
  if (!state.tabs.includes(path)) state.tabs.push(path);
  state.active = path;
  renderTabs();
  renderCrumbs(path);
  contentEl.innerHTML = path ? renderNodePage(BY_PATH.get(path)) : renderOverview();
  contentEl.scrollTop = 0;
  if (path) reveal(path); else treeEl.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  document.getElementById("title").textContent = (path ? BY_PATH.get(path).name + " — " : "") + "NetflixScout — Mappa del progetto";
}

function renderTabs() {
  tabsEl.innerHTML = state.tabs.map(p => {
    const n = p ? BY_PATH.get(p) : null;
    const ico = n ? (n.type === "dir" ? FOLDER_ICO : icon(n)) : `<span style="color:#3794ff">◈</span>`;
    const name = n ? n.name : "Panoramica";
    const cls = n && n.g ? ` style="color:var(--git-${n.g.toLowerCase()})"` : "";
    return `<div class="tab${p === state.active ? " on" : ""}" data-tab="${p}" title="${p || "Grafico della struttura"}">` +
      `<span class="ico">${ico}</span><span${cls}>${name}</span>` +
      (p ? `<span class="x" data-close="${p}">✕</span>` : `<span class="x" style="visibility:hidden"></span>`) + `</div>`;
  }).join("");
  const on = tabsEl.querySelector(".tab.on");
  if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
}
tabsEl.addEventListener("click", ev => {
  const close = ev.target.closest("[data-close]");
  if (close) {
    const p = close.dataset.close, i = state.tabs.indexOf(p);
    state.tabs.splice(i, 1);
    if (state.active === p) go(state.tabs[Math.max(0, i - 1)] || "");
    else renderTabs();
    return;
  }
  const t = ev.target.closest(".tab");
  if (t) go(t.dataset.tab);
});
tabsEl.addEventListener("auxclick", ev => {
  const t = ev.target.closest(".tab");
  if (ev.button === 1 && t && t.dataset.tab) t.querySelector("[data-close]").click();
});

function renderCrumbs(path) {
  if (!path) { crumbsEl.innerHTML = `<a href="#">NetflixScout</a><span class="sep">›</span><span>Panoramica</span>`; return; }
  const parts = path.split("/");
  crumbsEl.innerHTML = `<a href="#">NetflixScout</a>` + parts.map((p, i) => {
    const sub = parts.slice(0, i + 1).join("/");
    return `<span class="sep">›</span>` + (i === parts.length - 1 ? `<span style="color:#ddd">${p}</span>` : `<a href="#${sub}">${p}</a>`);
  }).join("");
}

const strip = html => html.replace(/<[^>]+>/g, "");
function layerTag(L) {
  const l = LAYERS[L]; if (!l) return "";
  return `<span class="tag" style="color:${l.color};border-color:${l.color}55;background:${l.color}14">${l.label}</span>`;
}
function gitTag(n) {
  let t = "";
  if (n.g === "M") t += `<span class="tag" style="color:var(--git-m);border-color:#e2c08d55">M · modificato, non committato</span>`;
  if (n.g === "U") t += `<span class="tag" style="color:var(--git-u);border-color:#73c99155">U · nuovo, non tracciato</span>`;
  if (n.ig) t += `<span class="tag" style="color:#9a9a9a;border-color:#ffffff22">ignorato da git</span>`;
  return t;
}
function chip(p) {
  const n = BY_PATH.get(p);
  if (!n) return `<span class="chip ext">${p}</span>`;
  return `<a class="chip" href="#${p}" title="${strip(n.s || "").replace(/"/g, "&quot;")}"><span style="display:grid;place-items:center;width:14px">${n.type === "dir" ? FOLDER_ICO : icon(n)}</span>${p}</a>`;
}

function renderNodePage(n) {
  const isDir = n.type === "dir";
  const vs = `vscode://file${ROOT_ABS}/${n.path}`;
  let h = `<div class="page">
    <h1><span class="ico" style="display:grid;place-items:center">${isDir ? FOLDER_ICO : icon(n)}</span>${n.name}${isDir ? "/" : ""}</h1>
    <div class="path">${n.path}${isDir ? "/" : ""} ${n.name === ".env" ? "" : `<a class="vscode" href="${vs}">Apri in VS Code ↗</a>`}</div>
    <div class="tags">${layerTag(n.L)}${gitTag(n)}</div>
    <p class="lead">${n.s || ""}</p>`;

  if (n.d) h += `<h2>${isDir ? "Cosa contiene" : "Cosa fa"}</h2><p>${n.d}</p>`;
  if (n.it && n.it.length)
    h += `<h2>Elementi principali</h2><table class="items">${n.it.map(([k, v]) => `<tr><td><code>${k}</code></td><td>${v}</td></tr>`).join("")}</table>`;
  if (n.cmd) h += `<h2>Comando</h2><pre class="cmd">${n.cmd}</pre>`;

  if (isDir) {
    h += `<h2>Contenuto · ${n.children.length} elementi</h2>`;
    h += n.children.length
      ? `<div class="cards">${n.children.map(c => `<a class="card" href="#${c.path}"><span class="ico">${c.type === "dir" ? FOLDER_ICO : icon(c)}</span><div><b style="${c.g ? `color:var(--git-${c.g.toLowerCase()})` : c.ig ? "color:#8a8a8a" : ""}">${c.name}${c.type === "dir" ? "/" : ""}</b><span>${c.s || ""}</span></div></a>`).join("")}</div>`
      : `<p class="none">Cartella vuota.</p>`;
  } else {
    const deps = n.dep || [];
    h += `<h2>Dipende da</h2>` + (deps.length || (n.x && n.x.length)
      ? `<div class="chips">${deps.map(chip).join("")}${(n.x || []).map(x => `<span class="chip ext" title="Libreria esterna">📦 ${x}</span>`).join("")}</div>`
      : `<p class="none">Nessun modulo interno.</p>`);
    h += `<h2>Usato da</h2>` + (n.usedBy.length
      ? `<div class="chips">${n.usedBy.map(chip).join("")}</div>`
      : `<p class="none">Nessun modulo del progetto lo importa${n.L === "data" ? " (è un file di dati)" : ""}.</p>`);
  }
  if (n.n && n.n.length) h += `<h2>Da sapere</h2><div class="callout"><ul>${n.n.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  return h + `</div>`;
}

    let pts;
    if (e.via) {

    } else {
      const dir = e.dir || (Math.abs(bc.x - ac.x) > Math.abs(bc.y - ac.y) ? "h" : "v");
      if (dir === "h") {
        const s = [bc.x > ac.x ? a.x + a.w : a.x, ac.y], t = [bc.x > ac.x ? b.x : b.x + b.w, bc.y], mx = (s[0] + t[0]) / 2;

      } else {

        const s = [sx, bc.y > ac.y ? a.y + a.h : a.y], t = [bc.x, bc.y > ac.y ? b.y : b.y + b.h], my = (s[1] + t[1]) / 2;
        pts = [s, [s[0], my], [t[0], my], t];

    }
    const d = "M" + pts.map(p => p.join(" ")).join(" L");
    edges += `<path d="${d}" fill="none" stroke="#8b949e" stroke-width="1.3" ${e.dash ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#ah)" ${e.both ? 'marker-start="url(#ah)"' : ""}/>`;
    if (e.l) {
      let lp = e.lp;
      if (!lp) {
        const i = Math.floor((pts.length - 1) / 2), p1 = pts[i], p2 = pts[i + 1];
        lp = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
      }
      const halo = lp[1] < 215 ? "#1a2322" : "#1c1f27";
      labels += `<text x="${lp[0]}" y="${lp[1] + 3.5}" text-anchor="middle" font-size="10" fill="#b8b8b8" paint-order="stroke" stroke="${halo}" stroke-width="5" stroke-linejoin="round">${esc(e.l)}</text>`;
    }
  }
  let nodes = "";
  for (const n of Object.values(N)) {
    const k = KIND[n.k], cx = n.x + n.w / 2;
    const dash = k.dash || (n.dash ? "4 3" : "");
    const attrs = `fill="${k.fill}" stroke="${k.stroke}" stroke-width="1.5" ${dash ? `stroke-dasharray="${dash}"` : ""}`;
    let shape, ty, sy;
    if (n.cyl) {
      const ry = 7;
      shape = `<path d="M${n.x} ${n.y + ry} a${n.w / 2} ${ry} 0 0 0 ${n.w} 0 v${n.h - 2 * ry} a${n.w / 2} ${ry} 0 0 1 ${-n.w} 0 z" ${attrs}/>` +
              `<ellipse cx="${cx}" cy="${n.y + ry}" rx="${n.w / 2}" ry="${ry}" ${attrs}/>`;
      ty = n.y + n.h / 2 + 6; sy = ty + 14;
    } else {
      shape = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" ${attrs}/>`;
      ty = n.s ? n.y + n.h / 2 - 3 : n.y + n.h / 2 + 4; sy = ty + 14;
    }
    const title = n.p ? `<title>${n.p} — clicca per la spiegazione</title>` : "";
    const api = n.api ? `<g><rect x="${n.x + n.w - 24}" y="${n.y - 7}" width="28" height="14" rx="7" fill="#c2732a"/><text x="${n.x + n.w - 10}" y="${n.y + 3}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">API</text></g>` : "";
    nodes += `<g class="${n.p ? "n" : ""}" ${n.p ? `data-path="${n.p}"` : ""}>${title}${shape}` +
      `<text x="${cx}" y="${ty}" text-anchor="middle" style="font-family:var(--mono)" font-size="${n.bar ? 11.5 : n.cyl ? 10.5 : 11}" font-weight="600" fill="#ececec">${esc(n.t)}</text>` +
      (n.s ? `<text x="${cx}" y="${sy}" text-anchor="middle" font-size="10" fill="#a9a9a9">${esc(n.s)}</text>` : "") + api + `</g>`;
  }
  return `<svg viewBox="0 0 1000 640" role="img" aria-label="Architettura di NetflixScout" style="font-family:var(--sans)">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
    <rect x="8" y="8" width="984" height="200" rx="10" fill="#1a2322" stroke="#2bb3a033"/>
    <text x="24" y="31" font-size="11" font-weight="700" letter-spacing=".06em" fill="#2bb3a0">① INDICIZZAZIONE OFFLINE</text>
    <text x="210" y="31" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">python buildSemanticDb.py --embedding-backend openai|local</text>
    <rect x="8" y="222" width="984" height="410" rx="10" fill="#1c1f27" stroke="#4a9eff33"/>
    <text x="24" y="245" font-size="11" font-weight="700" letter-spacing=".06em" fill="#4a9eff">② RUNTIME</text>
    <text x="110" y="245" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">python app.py</text>
    ${edges}${nodes}${labels}
  </svg>`;
}

function renderOverview() {
  const L = (k, label) => `<span><i style="background:${KIND[k].fill};border-color:${KIND[k].stroke}${KIND[k].dash ? ";border-style:dashed" : ""}"></i>${label}</span>`;
  return `<div class="page" style="max-width:1120px">
    <h1><span style="color:#3794ff">◈</span>NetflixScout</h1>
    <div class="path">Mappa del progetto · grafico della struttura</div>
    <p class="lead">Assistente da terminale che consiglia film con una pipeline RAG sul CMU Movie Summary Corpus: ChromaDB per la ricerca, Cohere per il rerank, OpenAI per classificazione, segnali, embedding e risposta.</p>
    <p style="color:var(--muted)">Clicca un riquadro del grafico, oppure un file o una cartella nell'explorer a sinistra, per leggerne la spiegazione.</p>
    <div class="diagram" id="diagram">${renderDiagram()}</div>
    <div class="legend">
      ${L("off", "Indicizzazione offline")}${L("rt", "Runtime RAG")}${L("orch", "Orchestrazione / guardrail")}${L("out", "Output / presenter")}${L("entry", "Entry point")}${L("data", "Dati locali")}${L("ext", "Esterno / non è un file")}
      <span><i style="background:#c2732a;border-color:#c2732a;border-radius:7px"></i>chiama un'API a pagamento</span>
    </div>

    <h2>Il flusso in 7 passi</h2>
    <ol class="steps">
      <li><b>Indicizzazione (una volta sola).</b> <a class="vscode" href="#buildSemanticDb.py">buildSemanticDb.py</a> legge <code>dataset/</code>. Ogni trama diventa un chunk con titolo, anno, generi e cast; gli embedding finiscono in Chroma, in <code>dbVettoriale/&lt;backend&gt;/</code>.</li>
      <li><b>Guardrail.</b> <a class="vscode" href="#app.py">app.py</a> riceve la domanda e <a class="vscode" href="#${Q}query_classifier/query_classifier.py">query_classifier</a> (gpt-4o-mini) blocca quelle che non riguardano il cinema, rispondendo in italiano o in inglese.</li>
      <li><b>Orchestrazione.</b> <a class="vscode" href="#orchestrator.py">orchestrator.py</a>, con una sola chiamata LLM, riscrive le domande di follow-up in una query autonoma usando la history (“e uno più recente?” → “film di fantascienza con robot più recenti”) e sceglie il tool. Oggi c'è solo <code>rag_search</code>, che è anche il fallback; la query autonoma vale per qualunque tool.</li>
      <li><b>Retrieval.</b> <a class="vscode" href="#${Q}retrieval.py">retrieval.py</a> estrae i segnali dalla query (cosa vuoi, cosa evitare, cosa escludere) e cerca fino a <code>k_largo = 10</code> candidati in modalità <code>semantic</code>, <code>bm25</code> o <code>hybrid</code>.</li>
      <li><b>Rerank.</b> <a class="vscode" href="#${Q}rerank.py">rerank.py</a> riordina con Cohere <code>rerank-v3.5</code> e tiene i primi <code>k_finale = 3</code>.</li>
      <li><b>Risposta.</b> L'orchestratore scrive la risposta usando solo i chunk ricevuti. Ogni 12 messaggi <a class="vscode" href="#${Q}conversation.py">conversation.py</a> compatta la history.</li>
      <li><b>Output.</b> <code>handle_query</code> in <a class="vscode" href="#app.py">app.py</a> non stampa nulla: impacchetta risposta e passaggi in un <a class="vscode" href="#turn.py">TurnResult</a>. Poi <a class="vscode" href="#presenters">presenters/</a> lo mostra in base al canale dichiarato dall'entry point: a terminale il resoconto completo (tool, K LARGO, RERANKING, risposta); per il web (predisposto, non ancora implementato) una struttura dati per il frontend.</li>
    </ol>

    <h2>Punti di attenzione nel codice</h2>
    <div class="callout"><ul>
      <li>Il README è in parte superato rispetto ad <code>app.py</code> e <code>orchestrator.py</code>.</li>
      <li>Il commit “migrate db to Qdrant” non corrisponde al codice, che usa solo ChromaDB.</li>
      <li>In modalità bm25/hybrid l'indice BM25 viene ricostruito su tutto il corpus a ogni query (<a class="vscode" href="#${Q}hybrid.py">hybrid.py</a>).</li>
      <li><code>max_iterations</code>, <code>max_execution_time</code> e <code>token_budget</code> sono in CONFIG ma il codice non li usa.</li>
    </ul></div>
  </div>`;
}

contentEl.addEventListener("click", ev => {
  const g = ev.target.closest("#diagram [data-path]");
  if (g) go(g.dataset.path);
});

/* Status bar */
(() => {
  let m = 0, u = 0;
  BY_PATH.forEach(n => { if (n.type === "file" && n.g === "M") m++; if (n.type === "file" && n.g === "U") u++; });
  document.getElementById("git-count").textContent = `● ${m} modificati   ＋ ${u} nuovi`;
})();

open(decodeURIComponent(location.hash.slice(1)));
</script>
