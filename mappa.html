<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetflixScout — Mappa del progetto</title>
<style>
  :root {
    --bg: #1e1e1e;
    --sidebar: #181818;
    --activity: #181818;
    --border: #2b2b2b;
    --tab-bg: #181818;
    --tab-active: #1f1f1f;
    --text: #cccccc;
    --muted: #8b8b8b;
    --accent: #0078d4;
    --hover: #2a2d2e;
    --selected: #04395e;
    --git-m: #e2c08d;
    --git-u: #73c991;
    --ignored: #6e6e6e;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-rows: 30px 1fr 22px; height: 100vh; }
  .titlebar { background: #181818; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); position: relative; }
  .titlebar .dots { position: absolute; left: 12px; display: flex; gap: 8px; }
  .titlebar .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .workbench { display: grid; grid-template-columns: 48px var(--side-w, 280px) 4px 1fr; min-height: 0; }

  /* Activity bar */
  .activity { background: var(--activity); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .activity button { width: 48px; height: 48px; background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; place-items: center; border-left: 2px solid transparent; }
  .activity button.on { color: #fff; border-left-color: var(--accent); }
  .activity button:hover { color: #fff; }

  /* Sidebar */
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .side-title { height: 35px; display: flex; align-items: center; padding: 0 20px; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .section-head { display: flex; align-items: center; height: 22px; padding: 0 8px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; cursor: default; }
  .section-head .chev { width: 16px; display: grid; place-items: center; }
  .section-head .actions { margin-left: auto; display: flex; gap: 2px; }
  .section-head .actions button { background: none; border: 0; color: var(--text); cursor: pointer; width: 22px; height: 20px; border-radius: 4px; display: grid; place-items: center; }
  .section-head .actions button:hover { background: #ffffff1a; }
  .tree { overflow: auto; flex: 1; padding-bottom: 24px; outline: none; }
  .sash { cursor: col-resize; background: transparent; }
  .sash:hover, .sash.drag { background: var(--accent); }

  .row { height: 22px; display: flex; align-items: center; padding-left: calc(var(--d) * 12px + 6px); padding-right: 10px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; position: relative; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--selected); border-color: var(--accent); }
  .row .twist { width: 16px; flex: none; display: grid; place-items: center; color: var(--text); }
  .row .twist svg { transition: transform .1s; }
  .node.open > .row .twist svg { transform: rotate(90deg); }
  .row .ico { width: 16px; flex: none; margin-right: 6px; display: grid; place-items: center; font: 600 10px/1 var(--mono); }
  .row .label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .badge { font: 11px var(--mono); margin-left: 8px; }
  .row.g-M .label, .row.g-M .badge { color: var(--git-m); }
  .row.g-U .label, .row.g-U .badge { color: var(--git-u); }
  .row.ig .label { color: var(--ignored); }
  .row.has-M .label { color: var(--git-m); }
  .row.has-U .label { color: var(--git-u); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 8px; }
  .children { display: none; position: relative; }
  .node.open > .children { display: block; }
  .children::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--d) * 12px + 14px); border-left: 1px solid #585858; opacity: 0; transition: opacity .15s; z-index: 1; pointer-events: none; }
  .tree:hover .children::before { opacity: .45; }

  /* Editor */
  .editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .tabs { display: flex; background: var(--tab-bg); border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 6px; height: 35px; padding: 0 8px 0 12px; border-right: 1px solid var(--border); cursor: pointer; color: var(--muted); white-space: nowrap; border-top: 1px solid transparent; }
  .tab.on { background: var(--tab-active); color: #fff; border-top-color: var(--accent); }
  .tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; visibility: hidden; color: var(--text); }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab .x:hover { background: #ffffff1a; }
  .tab .ico { font: 600 10px/1 var(--mono); width: 16px; display: grid; place-items: center; }
  .crumbs { height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 16px; color: var(--muted); font-size: 12px; flex: none; border-bottom: 1px solid #ffffff08; }
  .crumbs a:hover { color: #fff; }
  .crumbs .sep { opacity: .6; }
  .content { overflow: auto; flex: 1; }
  .page { max-width: 980px; padding: 28px 40px 60px; }

  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; color: #fff; display: flex; align-items: center; gap: 10px; }
  h1 .ico { font: 700 13px/1 var(--mono); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 10px; font-weight: 600; }
  p { margin: 0 0 12px; max-width: 78ch; }
  code { font: 12px var(--mono); background: #ffffff12; padding: 1px 5px; border-radius: 4px; color: #d7ba7d; }
  .lead { font-size: 15px; color: #e6e6e6; margin: 10px 0 18px; }
  .path { font: 12px var(--mono); color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; align-items: center; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
  .vscode { font-size: 12px; color: #3794ff; margin-left: 4px; }
  .vscode:hover { text-decoration: underline; }

  table.items { border-collapse: collapse; width: 100%; }
  table.items td { padding: 7px 12px 7px 0; border-bottom: 1px solid #ffffff0d; vertical-align: top; }
  table.items td:first-child { white-space: nowrap; width: 1%; padding-right: 20px; }
  table.items td:first-child code { color: #dcdcaa; background: none; padding: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 4px; background: #ffffff0d; border: 1px solid #ffffff14; font: 12px var(--mono); }
  .chip:hover { background: #ffffff1a; border-color: #ffffff30; }
  .chip.ext { color: var(--muted); }
  .none { color: var(--muted); font-style: italic; }

  .callout { border-left: 3px solid #cca700; background: #cca70012; padding: 10px 14px; border-radius: 0 4px 4px 0; }
  .callout ul { margin: 0; padding-left: 18px; }
  .callout li { margin: 3px 0; }
  pre.cmd { font: 12px/1.6 var(--mono); background: #0d0d0d; border: 1px solid #ffffff12; border-radius: 6px; padding: 10px 14px; overflow-x: auto; color: #9cdcfe; margin: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .card { display: flex; gap: 10px; padding: 10px 12px; border-radius: 6px; background: #ffffff08; border: 1px solid #ffffff10; }
  .card:hover { background: #ffffff12; border-color: #ffffff28; }
  .card .ico { font: 600 10px/1 var(--mono); width: 16px; margin-top: 3px; flex: none; text-align: center; }
  .card b { font: 600 12.5px var(--mono); color: #e6e6e6; display: block; }
  .card span { font-size: 12px; color: var(--muted); }

  /* Diagram */
  .diagram { background: #181818; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .diagram .n { cursor: pointer; }
  .diagram .n:hover rect, .diagram .n:hover path, .diagram .n:hover ellipse { filter: brightness(1.45); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1.5px solid; }
  ol.steps { padding-left: 20px; max-width: 80ch; }
  ol.steps li { margin: 6px 0; }

  .statusbar { background: var(--accent); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 10px; font-size: 12px; }
  .statusbar .r { margin-left: auto; display: flex; gap: 16px; }

  @media (max-width: 760px) {
    .workbench { grid-template-columns: 0 220px 0 1fr; }
    .activity { display: none; }
    .page { padding: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <span id="title">NetflixScout — Mappa del progetto</span>
  </div>

  <div class="workbench" id="workbench">
    <nav class="activity">
      <button class="on" title="Esplora risorse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H7a2 2 0 0 0-2 2v12"/><path d="M9 7h8l3 3v9a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button title="Panoramica (grafico)" id="act-overview">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="6" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M6.5 9v3h11V9M12 12v3"/></svg>
      </button>
    </nav>

    <aside class="sidebar">
      <div class="side-title">EXPLORER</div>
      <div class="section-head">
        <span class="chev"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span>
        NETFLIXSCOUT
        <span class="actions">
          <button id="btn-overview" title="Panoramica (grafico)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="2" width="5" height="4" rx=".5"/><rect x="9" y="2" width="5" height="4" rx=".5"/><rect x="5.5" y="10" width="5" height="4" rx=".5"/><path d="M4.5 6v2h7V6M8 8v2"/></svg></button>
          <button id="btn-collapse" title="Comprimi cartelle"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4.5" y="4.5" width="9" height="9" rx="1"/><path d="M2.5 11V3.5a1 1 0 0 1 1-1H11M7 9h4"/></svg></button>
        </span>
      </div>
      <div class="tree" id="tree" tabindex="0"></div>
    </aside>
    <div class="sash" id="sash"></div>

    <main class="editor">
      <div class="tabs" id="tabs"></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <footer class="statusbar">
    <span>⎇ main</span>
    <span id="git-count"></span>
    <span class="r"><span>Python 3.11 (.venv)</span><span>Qdrant</span><span>UTF-8</span></span>
  </footer>
</div>

<script>
/* ======================================================================
   Percorso assoluto usato dal link "Apri in VS Code" (vscode://file/...).
   ====================================================================== */
const ROOT_ABS = "/Users/filippo.milzagmail.com/Desktop/NetflixScout";

const Q = "tool/rag/FromQueryEmbeddingToRes/";
const E = "tool/rag/EmbeddingProcess/";
const M = "movie_db/";
const MT = "tool/movie_db/";
const T = "tool/tmdb/";
const W = "tool/wikipedia/";
const Y = "tool/youtube/";

const LAYERS = {
  entry:  { label: "Entry point",            color: "#b48cff" },
  orch:   { label: "Orchestrazione",         color: "#ff7eb6" },
  off:    { label: "Indicizzazione offline", color: "#2bb3a0" },
  rt:     { label: "Runtime RAG",            color: "#4a9eff" },
  data:   { label: "Dati locali",            color: "#e0a43a" },
  cfg:    { label: "Config / docs",          color: "#9da5b4" },
  out:    { label: "Output / presenter",     color: "#56d4dd" },
  test:   { label: "Test",                   color: "#73c991" },
  db:     { label: "Tool DB MovieLens",      color: "#f78c6c" },
  tmdb:   { label: "Tool TMDb",              color: "#c3e88d" },
  youtube: { label: "Tool YouTube",          color: "#ffcb6b" },
  wikipedia: { label: "Tool Wikipedia",        color: "#89ddff" },
  web:    { label: "Server web / liste",     color: "#e06c75" },
};

const F = (name, info = {}) => ({ type: "file", name, ...info });
const D = (name, info = {}, children = []) => ({ type: "dir", name, children, ...info });

/* ---------- File del vecchio Chroma (dati non più usati, riusati in ogni cartella) ---------- */
const SQLITE = {
  L: "data", ig: true,
  s: "Database SQLite di Chroma: documenti, metadati e definizione delle collection.",
  d: `File principale del vecchio database Chroma (non più usato dall'app). Contiene il testo dei chunk, i metadati (<code>title</code>, <code>release_year</code>, <code>genres</code>, <code>cast</code>, …), gli id e la configurazione della collection (<code>hnsw:space = cosine</code>). I vettori veri e propri stanno nella sottocartella con nome UUID.`,
  n: ["Non va modificato a mano: si rigenera con <code>python buildSemanticDb.py</code>."],
};
const BIN = {
  "data_level0.bin": "I vettori di embedding e il livello 0 del grafo HNSW (la parte più grande dell'indice).",
  "header.bin": "Intestazione dell'indice hnswlib: dimensione dei vettori, parametri M/ef, numero di elementi.",
  "length.bin": "Metadati di servizio di hnswlib sulle lunghezze dei record.",
  "link_lists.bin": "Collegamenti dei livelli superiori del grafo HNSW (servono per navigare velocemente verso i vicini).",
  "index_metadata.pickle": "Mappa id ↔ posizione nell'indice salvata da Chroma (formato pickle).",
};
function segment(uuid, files) {
  return D(uuid, {
    L: "data", ig: true,
    s: "Segmento vettoriale HNSW della collection (nome = UUID generato da Chroma).",
    d: `Contiene l'indice di ricerca approssimata dei vicini (HNSW, libreria <code>hnswlib</code>) su cui Chroma esegue <code>collection.query(query_embeddings=…)</code>. Il nome della cartella è l'id interno del segmento.`,
  }, files.map(f => F(f, { L: "data", ig: true, s: BIN[f], d: BIN[f] + " File binario generato automaticamente: non si apre e non si modifica." })));
}
function chromaDir(name, uuid, files, info) {
  return D(name, { L: "data", ig: true, ...info }, [F("chroma.sqlite3", SQLITE), segment(uuid, files)]);
}
const BINS4 = ["data_level0.bin", "header.bin", "length.bin", "link_lists.bin"];
const BINS5 = ["data_level0.bin", "header.bin", "index_metadata.pickle", "length.bin", "link_lists.bin"];
const DIAG_NOTE = "Cartella di diagnostica creata durante il debug della validazione dei metadati a batch. Il codice non la usa (non la legge più nessuno): si può cancellare.";

/* ====================================================================== */
const TREE = D("NetflixScout", {}, [

  D(".venv", {
    L: "cfg", ig: true,
    s: "Virtualenv Python 3.11 con le dipendenze installate.",
    d: `Ambiente isolato creato con <code>python3.11 -m venv .venv</code>. Contiene l'interprete e i pacchetti di <code>requirements.txt</code> (più <code>pytest</code>). È ignorato da git e non va mai committato.`,
    cmd: "source .venv/bin/activate\npip install -r requirements.txt pytest",
  }),

  D("dataset", {
    L: "data", ig: true,
    s: "Corpus di input: CMU Movie Summary Corpus (non versionato).",
    d: `È la sorgente da cui <code>buildSemanticDb.py</code> costruisce il database vettoriale. Va scaricato a mano da <a class="vscode" href="https://www.cs.cmu.edu/~ark/personas/" target="_blank" rel="noopener">cs.cmu.edu/~ark/personas</a>. Il builder scorre tutti i file in ordine alfabetico: le trame passano da <code>movie_metadata.py</code>, i file <code>.tsv</code> sono saltati (vengono letti solo come metadati), gli altri formati passano dai <code>loaders/</code>.`,
  }, [
    D("MovieSummaries", {
      L: "data", ig: true,
      s: "I file originali del corpus CMU (trame di Wikipedia + metadati Freebase).",
      d: `Circa 42.000 trame di film estratte da Wikipedia, unite ai metadati di circa 81.000 film presi da Freebase. Il join avviene sul <code>wikipedia_movie_id</code>.`,
    }, [
      F("README.txt", { L: "data", ig: true, s: "Descrizione ufficiale del corpus e del formato delle colonne.", d: `Documentazione degli autori del dataset. Il builder lo tratta come un normale <code>.txt</code>: passa dal loader, da <code>clean.py</code> e da <code>chunk_semantic</code>, quindi finisce anche lui nel DB come chunk con <code>source = MovieSummaries/README.txt</code>.`, n: ["Questi chunk non hanno titolo, anno e generi: possono comparire nei risultati come rumore."] }),
      F("character.metadata.tsv", { L: "data", ig: true, s: "Personaggi e attori di ogni film.", d: `Una riga per personaggio: id del film, nome del personaggio, attore, genere, età. <code>load_cast_by_movie()</code> lo usa per costruire il campo <code>cast</code> dei metadati.` }),
      F("movie.metadata.tsv", { L: "data", ig: true, s: "Metadati dei film: titolo, data di uscita, lingue, paesi, generi.", d: `Letto da <code>load_movie_metadata()</code>. Colonne come lingue, paesi e generi sono dizionari Freebase serializzati in JSON (<code>{"/m/02h40lc": "English Language"}</code>) che vengono normalizzati in stringhe leggibili.` }),
      F("name.clusters.txt", { L: "data", ig: true, s: "Cluster di nomi di personaggi (non usato dall'app).", d: `Raggruppa i personaggi che sono la stessa entità in film diversi. NetflixScout non lo usa per i metadati, ma essendo un <code>.txt</code> viene comunque indicizzato come testo generico.` }),
      F("plot_summaries.txt", { L: "data", ig: true, s: "Il cuore del corpus: una trama per riga (id\\ttrama).", d: `Formato <code>wikipedia_movie_id&lt;TAB&gt;trama</code>. Ha un percorso dedicato nel builder: <code>iter_plot_rows()</code> unisce ogni trama ai metadati e al cast, e ogni trama diventa <b>un solo chunk</b>, senza pulizia né chunking semantico.` }),
      F("tvtropes.clusters.txt", { L: "data", ig: true, s: "Personaggi classificati per tropo di TV Tropes (non usato dall'app).", d: `Personaggi annotati con 72 tropi (es. <i>dumb muscle</i>). Come gli altri <code>.txt</code> finisce nel DB come testo generico.` }),
    ]),
  ]),

  D("dbVettoriale", {
    L: "data", ig: true,
    s: "Cartella dati del vecchio Chroma e dello storage Qdrant (l'indice vivo è in qdrant_openai/storage).",
    d: `L'app non legge più nulla da qui tramite <code>db_dir</code>: l'unico motore è Qdrant, in modalità server su 127.0.0.1:6333, avviato da <code>./scripts/start_qdrant.sh</code> sullo storage <code>qdrant_openai/storage</code> (la collection si chiama <code>netflix_scout</code>). Le cartelle <code>openai/</code>, <code>local/</code> e <code>diag_*</code>/<code>test_*</code> sono dati Chroma non più usati: restano su disco, si possono cancellare a mano.`,
    n: ["La query va embeddata con lo stesso modello usato per costruire l'indice, altrimenti i risultati non hanno senso."],
  }, [
    chromaDir("openai", "ccd8ca3a-7582-4c5a-8a88-305387ceebcc", BINS5, { s: "DB costruito con embedding OpenAI text-embedding-3-small (backend di default).", d: `Vecchio indice Chroma, non più usato dall'app (l'indice vivo è Qdrant). Dato inutilizzato.` }),
    chromaDir("local", "ab13cb76-df1d-42d3-af67-7f60f102b828", BINS5, { s: "DB costruito con embedding locali (sentence-transformers).", d: `Vecchio indice Chroma con embedding locali, non più usato dall'app. Dato inutilizzato.` }),
    chromaDir("diag_metadata_batch", "9e7ec721-7943-4bfe-a11c-24adcb6fc939", BINS4, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("diag_metadata_batch2", "93be12ac-ec64-4712-a51c-50d086cda8a3", BINS5, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("diag_metadata_batch_fixed", "0305a07c-6617-43b2-8ae4-82fc2cc0ec4b", BINS5, { s: "Residuo di diagnostica (validazione metadati).", d: DIAG_NOTE }),
    chromaDir("test_metadata_batch", "db1416b5-bc32-474d-866d-0d34d1d52ef5", BINS4, { s: "Residuo di test (validazione metadati).", d: DIAG_NOTE }),
  ]),

  D("movie_db", {

    F("config.py", { L: "tmdb", s: "<code>TmdbConfig</code>: vista validata di <code>CONFIG[\"tmdb\"]</code>, solo tre campi e nessun default.", d: `<code>max_results</code> (1–20), <code>max_calls_per_turn</code> (1–20), <code>cache_ttl</code> (0–86400, 0 disattiva la cache). <code>extra="forbid"</code>; ogni campo ha <code>ui_exposed</code> nello schema JSON. <code>load_tmdb_config</code> valida la sezione dopo gli override di <code>build_runtime_config</code>.`, x: ["pydantic"] }),
    F("settings.py", { L: "tmdb", s: "Costanti interne, fuori da <code>CONFIG</code> di proposito.", d: `Timeout HTTP 8 s, cache da 256 voci, pausa dopo un 429 (10 s, massimo 120), regione di default <code>IT</code>, URL delle immagini, lingue API (<code>it-IT</code> / <code>en-US</code>) e lingua di riferimento <code>en-US</code> per generi e provider. Nessuna di queste limita le chiamate HTTP.` }),
    F("auth.py", { L: "tmdb", s: "Credenziali: <b>unico</b> modulo che legge la chiave dall'ambiente.", d: `Legge <code>VUE_APP_TMDB_API_KEY</code> e <code>VUE_APP_TMDB_BASE_URL</code> (con <code>load_dotenv</code>), accetta solo <code>https://api.themoviedb.org/3</code> e riconosce la modalità: chiave v3 (parametro <code>api_key</code>) o token v4 (<code>Authorization: Bearer</code>). <code>authorize</code> aggiunge la credenziale e la chiama solo <code>http.py</code>. Il <code>repr</code> delle credenziali maschera il segreto.`, dep: [T + "errors.py"], x: ["python-dotenv"] }),
    F("http.py", { L: "tmdb", s: "<b>Unico</b> punto di I/O verso TMDb: memo → cache → cooldown → budget → invio.", d: `<code>get_json</code> serve prima dal memo del turno (anche i fallimenti: una richiesta fallita non riparte), poi dalla cache TTL; altrimenti, se non c'è una pausa per 429 e il budget lo consente, registra l'URL mascherato e invia con <code>urllib</code>. 429 → pausa, 401 → stop delle richieste successive, 404 → non trovato. Gli errori sono rilanciati <code>from None</code> con messaggi senza URL. <code>optional_json</code> serve per i dati facoltativi: se il budget è finito li annota in <code>skipped_for_budget</code>.`, it: [["get_json(ctx, endpoint)", "Risposta JSON, dal memo o dalla cache quando possibile."], ["optional_json(ctx, endpoint, skipped, label)", "Come sopra, ma non fallisce il turno."], ["urllib_transport", "Il transport reale; nei test è sostituito da uno finto."]], dep: [T + "auth.py", T + "cache.py", T + "calls.py", T + "context.py", T + "cooldown.py", T + "endpoints.py", T + "errors.py", T + "settings.py"], n: ["Un test AST verifica che nessun altro modulo faccia I/O di rete."] }),
    F("budget.py", { L: "tmdb", s: "<code>CallBudget</code>: i tentativi HTTP del turno, l'unico limite alle chiamate.", d: `<code>try_reserve()</code> riserva un tentativo prima dell'invio (thread-safe); ogni invio conta anche se fallisce, i hit di memo e cache sono gratis. Viene creato in <code>TmdbTool.run</code> perché l'orchestratore esegue un solo tool per turno.`, n: ["Se si introduce un ciclo multi-step, il budget va spostato in un contesto di turno (lo ricorda <code>test_one_tool_run_per_turn</code>)."] }),
    F("cache.py", { L: "tmdb", s: "Cache TTL in memoria, condivisa tra i turni.", d: `Chiave = (path, parametri ordinati) costruita <b>prima</b> di aggiungere la credenziale, quindi senza chiave API. Salva solo risposte riuscite, scarta le voci scadute e le meno recenti oltre 256. Con <code>cache_ttl = 0</code> è disattivata (il memo del turno resta).`, dep: [T + "settings.py"] }),
    F("cooldown.py", { L: "tmdb", s: "Pausa dopo un HTTP 429: finché dura le richieste non vengono inviate né contate.", d: `La durata viene da <code>Retry-After</code>, limitata tra 1 e 120 secondi (10 s se manca). Nessun retry automatico.`, dep: [T + "settings.py"] }),
    F("calls.py", { L: "tmdb", s: "URL mostrati all'utente: solo base + path, credenziale mascherata.", d: `<code>display_url</code> ricostruisce l'URL dal path dell'endpoint, mai da quello inviato: niente parametri di ricerca né <code>append_to_response</code>; con chiave v3 aggiunge <code>?api_key=***</code>, con Bearer nessuna credenziale. <code>CallRecorder</code> raccoglie gli URL del turno per la trace.`, dep: [T + "auth.py"] }),
    F("context.py", { L: "tmdb", s: "<code>TmdbContext</code>: dipendenze esplicite di una run (un turno).", d: `Config, credenziali, cache, cooldown, budget, transport, lingua API, recorder delle chiamate, memo delle risposte e dei fallimenti del turno, risoluzioni già fatte. <code>limit(requested)</code> applica <code>max_results</code> alle liste.`, dep: [T + "auth.py", T + "budget.py", T + "cache.py", T + "calls.py", T + "config.py", T + "cooldown.py"] }),
    F("endpoints.py", { L: "tmdb", s: "<b>Unico</b> mapping operazione → path e parametri TMDb.", d: `I segmenti del path vengono solo da interi validati, enum chiusi o ID esterni controllati con regex ed escapati; titoli e nomi viaggiano solo come parametri codificati. <code>include_adult</code> sempre <code>false</code>; <code>append_to_response</code> rispetta il massimo documentato e le raccolte non lo usano. <code>IDENTITY_APPENDS</code> / <code>identity_appends(namespace)</code>: append fissi dei dettagli film e serie (credits, translations, alternative_titles e, per i film, release_dates), usati anche dalla verifica dell'identità così che sia la stessa chiamata dei dettagli.`, dep: [T + "models/enums.py"] }),
    F("dispatch.py", { L: "tmdb", s: "Tabella deterministica <code>TmdbOperation</code> → handler.", d: `<code>OPERATION_HANDLERS</code> collega ognuna delle 17 operazioni alla funzione in <code>operations/</code>. Un test verifica che ogni operazione abbia regola e handler.`, dep: [T + "operations"] }),
    F("runner.py", { L: "tmdb", s: "Esegue le richieste in ordine con un budget condiviso; i fallimenti diventano dati.", d: `Ogni richiesta produce un <code>RequestOutcome</code> con <code>status</code> <code>ok</code> / <code>partial</code> / <code>error</code>: budget finito o 429 non rompono il turno. Dopo un 401 le richieste successive non vengono inviate. <code>overall_status</code> riassume la run.`, dep: [T + "dispatch.py", T + "context.py", T + "errors.py"] }),
    F("prompt_budget.py", { L: "tmdb", s: "Impacchetta in modo deterministico i risultati nel contesto dell'LLM.", d: `L'orchestratore mette <code>metadata</code> intero nel prompt e mostra solo <code>chunks[:10]</code>: il tool si limita da solo (<code>MAX_TMDB_CONTEXT_CHARS</code> 12.000, <code>MAX_CHUNKS</code> 10). P0 (tipo, ID, titolo, anno) apre ogni chunk e non viene tagliato; P1 (essenziali delle entità di dettaglio) è sempre presente, ridotto a 1.000 caratteri togliendo prima tagline, URL e immagini e solo dopo accorciando la trama; P2 (facet e liste) entra finché c'è spazio. Le liste parziali finiscono in <code>metadata.tmdb.omitted</code> come <code>shown/total</code>.`, dep: [T + "models/results.py", T + "normalize/common.py", T + "operations/reference.py"] }),
    F("film_record.py", { L: "tmdb", s: "Legge un film da TMDb per ID, in inglese, per il catalogo vettoriale.", d: `Chiede sempre <code>en-US</code> e non usa <code>localized()</code>: la trama è quella inglese (traduzione <code>en</code>, o la propria se il film è in inglese), altrimenti <code>overview</code> è nulla e il catalogo scarta il film. Passa dal budget del turno e dalla cache; restituisce un dict con i campi di <code>CatalogRecord</code>.`, dep: [T + "tool.py"] }),
    F("enrich.py", { L: "tmdb", s: "<code>TmdbRagEnricher</code>: completa con TMDb i film scelti dal RAG.", d: `Dopo <code>rag_search</code> l'orchestratore gli passa il risultato. Prende i chunk finali (dopo il rerank, al massimo <code>max_candidates</code>, nell'ordine del RAG, senza duplicati), cerca ogni titolo in <code>en-US</code> senza filtro d'anno (<code>year_after_search</code>: un candidato costa 2 chiamate, ricerca + dettagli, anche se l'anno del corpus è sbagliato di 1; la ricerca con filtro è solo il ripiego) e aggiunge in <code>metadata.tmdb_enrichment</code> titolo, anno, regista, cast e sinossi solo se titolo e anno (±1) coincidono; altrimenti <code>unverified</code>, <code>not_found</code> o <code>skipped</code>. Non riordina i chunk e usa un solo budget, creato da <code>TmdbTool.new_context</code>. Un candidato riceve metadati solo con titolo o titolo originale uguali (mai per inclusione: “The Sinner” non è “The Sinners”) e anno ±1, in <code>strict_identity</code> (più risultati ugualmente validi → <code>ambiguous</code>). Un match tramite titolo alternativo o articolo (<code>matched_by: alternative_title</code>) richiede anche un attore in comune quando i cast sono noti (<code>cast_mismatch</code>); un anno confermato da una data di uscita secondaria dà <code>year_note</code>. Durata 0 scartata.<br><br>Lo step <code>tmdb_calls</code> del completamento porta le card solo per i film verificati (<code>matched</code>): un risultato TMDb non verificato non è il film del RAG.`, dep: [T + "tool.py", T + "runner.py", T + "trace.py"] }),
    F("work_type.py", { L: "tmdb", s: "<code>TmdbWorkTypeChecker</code>: film o serie per i ranking MovieLens.", d: `Una chiamata <code>/find</code> per IMDb id: solo <code>movie_results</code> → film, solo <code>tv_results</code> → serie; nessun risultato, entrambi, errore, id non numerico o chiave mancante → non verificabile (assente dalla risposta). Budget proprio (<code>MAX_CHECKS</code> 12 per chiamata, non quello del turno); si ferma su limite, 429 o chiave rifiutata. Lo collega <code>app.py</code> al tool MovieLens.`, dep: [T + "tool.py", T + "http.py", T + "endpoints.py"] }),
    F("trace.py", { L: "tmdb", s: "Step <code>tmdb_calls</code>: URL chiamati e attribuzioni.", d: `Fuori da <code>metadata</code> (che va nel prompt): le attribuzioni le mostrano i presenter, non l'LLM.<br><br><code>tmdb_cards</code> aggiunge a <code>data.items</code> le card di film e serie della run (una volta ciascuna, nell'ordine) con i valori grezzi di TMDb: da lì <code>web_lists</code> idrata le liste.` }),
    F("errors.py", { L: "tmdb", s: "Errori TMDb con messaggi sicuri.", d: `<code>TmdbConfigError</code>, <code>TmdbBudgetExhausted</code>, <code>TmdbRateLimited</code>, <code>TmdbAuthError</code>, <code>TmdbNotFound</code>, <code>TmdbHttpError</code>, <code>TmdbNetworkError</code>, <code>TmdbUnresolvedFilter</code>, ognuno con un <code>code</code>. I messaggi non contengono mai URL, query string, credenziali o testo dell'utente. <code>TmdbUnverifiedMatch</code> (<code>unverified_match</code>) porta <code>reason</code> (<code>title_mismatch</code>, <code>year_mismatch</code>, <code>ambiguous</code>) e i <code>candidates</code>.` }),

      F("requests.py", { L: "tmdb", s: "<code>TmdbToolInput</code> e <code>TmdbRequest</code>: tutto validato prima di qualunque HTTP.", d: `<code>extra="forbid"</code>, campi non ammessi dall'operazione, facet non supportate, filtri di discover incompatibili, ID esterni con pattern: un solo errore rifiuta l'intera run. Accetta anche una singola richiesta \"piatta\". <code>describe_validation_errors</code> riporta numero di richiesta, campo e tipo di errore, mai i valori inviati. Il campo <code>title</code> dice al planner che non è il nome di un personaggio (per trovare un film da un personaggio si usa <code>search</code>): aggiunto il 2026-10-27 dopo un <code>movie_details</code> con «Truman Burbank»; effetto sul modello reale non ancora verificato.`, it: [["TmdbToolInput", "<code>{query, requests: [1..4]}</code>."], ["TmdbRequest", "Una operazione con i suoi argomenti."], ["DiscoverFilters", "Filtri di discover; i nomi sono risolti in ID dal tool."], ["MAX_REQUESTS_PER_RUN = 4", "Vincolo di forma, non di chiamate."]], dep: [T + "models/enums.py", T + "models/operation_rules.py"], x: ["pydantic"] }),
      F("results.py", { L: "tmdb", s: "<code>Entity</code> e <code>RequestOutcome</code>: risultati normalizzati prima del packing.", d: `<code>Entity</code> ha identità (P0), <code>essentials</code> (P1) e <code>facets</code> con i totali prima del limite (P2). <code>RequestOutcome</code> raccoglie stato, errore, entità, elementi di lista, candidati, note e <code>skipped_for_budget</code>.<br><br><code>Entity</code> porta anche <code>release_date</code> e <code>poster_path</code> (valori grezzi per le card web, non nel contesto dell'LLM).`, x: ["pydantic"] }),

    D("operations", {
      L: "tmdb", s: "Handler per famiglia di endpoint: <code>(ctx, request) → RequestOutcome</code>.",
      d: `Ogni handler risolve l'ID se serve (<code>resolve.py</code>), chiama gli endpoint tramite <code>http.get_json</code> e normalizza con <code>normalize/</code>. Le facet richieste viaggiano nella stessa chiamata con <code>append_to_response</code> quando l'endpoint lo supporta.`,
    }, [
      F("__init__.py", { L: "tmdb", s: "Docstring del package.", d: `Nessun codice.` }),
      F("resolve.py", { L: "tmdb", s: "Ricerca e risoluzione degli ID: ID TMDb → <code>/find</code> → ricerca testuale.", d: `La scelta tra i risultati è deterministica: titolo esatto (originale o tradotto) → stesso anno → anno ±1 → dipartimento noto → più popolare. Le risoluzioni sono memorizzate per il turno; i candidati ambigui vengono riportati. Espone anche le operazioni <code>search</code> e <code>find_by_external_id</code>. Per film e serie non sceglie mai il più popolare senza titolo esatto: <code>_pick_work</code> richiede titolo esatto (con accenti, poi senza) e anno compatibile; altrimenti <code>_verify_by_details</code> controlla al massimo 2 schede della stessa opera (titoli tradotti o alternativi, oppure lo stesso titolo a meno dell'articolo iniziale; anno entro ±1 da una qualsiasi data di uscita registrata; senza anno solo un risultato unico) e in mancanza restituisce <code>unverified_match</code> con le alternative. Un titolo non trovato nella lingua del turno viene cercato una volta in inglese.`, dep: [T + "http.py", T + "endpoints.py", T + "operations/listing.py"] }),
      F("details.py", { L: "tmdb", s: "Passi comuni dei dettagli: parametri delle facet e fallback opzionali.", d: `Se <code>watch/providers</code> manca dalla risposta con append, una chiamata separata (contata); recensioni vuote nella lingua del turno → una chiamata in inglese (contata). Entrambe solo se avanza budget. Aggiunge i fallback di lingua per immagini e video nella stessa chiamata. Aggiunge all'esito le note <code>alternative_title_match</code> e <code>year_from_release_dates</code>.`, dep: [T + "http.py", T + "endpoints.py"] }),
      F("movies.py", { L: "tmdb", s: "<code>movie_details</code> e <code>movie_collection</code>.", d: `<code>credits</code> e <code>translations</code> sono sempre in append (gratis): regia e cast principale ci sono anche senza facet. <code>movie_collection</code> riusa la stessa richiesta (e la stessa voce di cache) di un <code>movie_details</code> semplice. Gli append fissi sono <code>endpoints.MOVIE_IDENTITY_APPENDS</code> (anche alternative_titles e release_dates).`, dep: [T + "operations/details.py", T + "operations/resolve.py", T + "operations/collections.py"] }),
      F("tv.py", { L: "tmdb", s: "<code>tv_details</code>, <code>tv_season</code>, <code>tv_episode</code>.", d: `Una chiamata con append per ciascuno, dopo la risoluzione della serie.`, dep: [T + "operations/details.py", T + "operations/resolve.py"] }),
      F("people.py", { L: "tmdb", s: "<code>person_details</code> con filmografia via facet.", d: `Credits e altre facet nella stessa chiamata; la persona si sceglie anche in base al dipartimento.`, dep: [T + "operations/details.py", T + "operations/resolve.py"] }),
      F("collections.py", { L: "tmdb", s: "Raccolte (saghe) e case di produzione.", d: `<code>/collection/{id}</code> non supporta <code>append_to_response</code>: immagini e traduzioni sono chiamate separate e opzionali, solo se avanza budget.`, dep: [T + "http.py", T + "operations/resolve.py"] }),
      F("discovery.py", { L: "tmdb", s: "<code>discover_movies</code> / <code>discover_tv</code> con filtri.", d: `Generi, persone, case, keyword e provider vengono prima risolti in ID; se uno non si risolve, discover non parte, perché filtri parziali darebbero risultati sbagliati. Con l'ordinamento per voto applica un numero minimo di voti.`, dep: [T + "operations/resolve.py", T + "operations/reference.py", T + "operations/listing.py"] }),

      F("reference.py", { L: "tmdb", s: "Dati di riferimento: generi, provider di streaming, certificazioni.", d: `Usati internamente per trasformare nomi in ID (confronto in inglese) ed esposti come operazioni. Sempre tramite <code>get_json</code>: in cache e contati come ogni chiamata. Definisce l'attribuzione <code>JUSTWATCH</code>.`, dep: [T + "http.py", T + "endpoints.py"] }),

      F("entities.py", { L: "tmdb", s: "Oggetti TMDb → <code>Entity</code>: identità (P0), essenziali (P1), facet (P2).", d: `Un normalizzatore per film, serie, stagione, episodio, persona, raccolta, casa di produzione ed elemento di lista. Trama e titolo vuoti nella lingua del turno vengono presi dalle <code>translations</code>, con <code>overview_language</code>. Le durate pari a 0 diventano assenti (<code>positive_minutes</code>); per le serie <code>episode_runtime_minutes</code> compare solo se TMDb lo fornisce, e non c'è mai una regia di serie.<br><br>Film, serie e voci di lista riportano <code>release_date</code> (o <code>first_air_date</code>) e <code>poster_path</code>.`, dep: [T + "normalize/common.py", T + "normalize/facets.py", T + "models/results.py"] }),

  D("wikipedia", {
    L: "wikipedia",
    s: "Tool <code>wikipedia_search</code>: informazioni enciclopediche su film, persone e movimenti, lette a sezioni.",
    d: `Tool <b>in-process</b> sulla MediaWiki Action API, senza chiave e senza MCP. L'articolo è scaricato una volta (cache TTL) e consegnato per sezioni fino al budget di contesto del turno; i passi successivi sulla stessa pagina sono cache hit. Il tool non decide se basta: offre <code>follow_up</code> e giudica il planner. Crediti: link alla pagina, licenza CC BY-SA 4.0 e nota che il testo è riformulato sono mostrati dai presenter.`,
    n: ["Verificato dal vivo il 2026-10-26: smoke test 3/3, routing eval Wikipedia 11/11, E2E con LLM reale su 12 domande (nessuna affermazione non supportata nei controlli sul testo delle pagine). Campione piccolo e una sola esecuzione: il rispetto delle istruzioni da parte del modello è osservato, non dimostrato; l'iniezione di istruzioni negli estratti non è stata provata."],

(function index(node, parent) {
  node.path = parent === null ? "" : (parent ? parent + "/" : "") + node.name;
  node.parentPath = parent;
  if (node.path) BY_PATH.set(node.path, node);
  if (node.children) {
    node.children.sort(sortKids);
    node.children.forEach(c => index(c, node.path));
  }
})(TREE, null);

const GIT = {};
for (const [p, g] of Object.entries(GIT)) if (BY_PATH.has(p)) BY_PATH.get(p).g = g;

// "Usato da" = dipendenze al contrario
for (const n of BY_PATH.values()) n.usedBy = [];
for (const n of BY_PATH.values()) (n.dep || []).forEach(p => BY_PATH.get(p) && BY_PATH.get(p).usedBy.push(n.path));

function gitInside(n) {
  if (n.type === "file") return n.g ? new Set([n.g]) : new Set();
  const s = new Set(n.g ? [n.g] : []);
  n.children.forEach(c => gitInside(c).forEach(v => s.add(v)));
  n.gitInside = s;
  return s;
}

function buildNode(n, depth) {
  const wrap = document.createElement("div");
  wrap.className = "node" + (OPEN_DEFAULT.has(n.path) ? " open" : "");
  const row = document.createElement("div");
  row.className = "row";
  row.style.setProperty("--d", depth);
  row.dataset.path = n.path;
  row.title = n.path;
  if (n.g) row.classList.add("g-" + n.g);
  if (n.ig) row.classList.add("ig");
  let badge = n.g ? `<span class="badge">${n.g}</span>` : "";
  if (n.type === "dir" && !n.g && n.gitInside && n.gitInside.size) {
    const k = n.gitInside.has("M") ? "M" : "U";
    row.classList.add("has-" + k);
    badge = `<span class="dot" style="background:var(--git-${k.toLowerCase()})"></span>`;
  }
  row.innerHTML =
    `<span class="twist">${n.type === "dir" ? CHEV : ""}</span>` +
    `<span class="ico">${icon(n)}</span>` +
    `<span class="label">${n.name}</span>${badge}`;
  wrap.appendChild(row);
  WRAP.set(n.path, wrap);
  if (n.type === "dir") {
    const kids = document.createElement("div");
    kids.className = "children";
    kids.style.setProperty("--d", depth);
    n.children.forEach(c => kids.appendChild(buildNode(c, depth + 1)));
    wrap.appendChild(kids);
  }
  return wrap;
}
TREE.children.forEach(c => treeEl.appendChild(buildNode(c, 0)));

treeEl.addEventListener("click", ev => {
  const row = ev.target.closest(".row");
  if (!row) return;
  const n = BY_PATH.get(row.dataset.path);
  if (n.type === "dir") {
    const wrap = WRAP.get(n.path);
    const wasActive = state.active === n.path;
    // Come VS Code: il click apre/chiude; in più mostra la pagina della cartella
    if (wasActive || !wrap.classList.contains("open")) wrap.classList.toggle("open");
  }
  go(n.path);
});

document.getElementById("btn-collapse").onclick = () =>
  WRAP.forEach(w => w.classList.remove("open"));
document.getElementById("btn-overview").onclick = () => go("");
document.getElementById("act-overview").onclick = () => go("");

function reveal(path) {
  const parts = path.split("/");
  for (let i = 1; i < parts.length; i++) {
    const w = WRAP.get(parts.slice(0, i).join("/"));
    if (w) w.classList.add("open");
  }
  treeEl.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  const w = WRAP.get(path);
  if (w) {
    const row = w.querySelector(":scope > .row");
    row.classList.add("active");
    const tr = treeEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
    if (rr.top < tr.top || rr.bottom > tr.bottom) row.scrollIntoView({ block: "center" });
  }
}

/* Tastiera: frecce su/giù, destra/sinistra per aprire/chiudere */
treeEl.addEventListener("keydown", ev => {
  const rows = [...treeEl.querySelectorAll(".row")].filter(r => r.offsetParent !== null);
  let i = rows.findIndex(r => r.classList.contains("active"));
  const cur = rows[i] && BY_PATH.get(rows[i].dataset.path);
  if (ev.key === "ArrowDown") i = Math.min(rows.length - 1, i + 1);
  else if (ev.key === "ArrowUp") i = Math.max(0, i - 1);
  else if (ev.key === "ArrowRight" && cur && cur.type === "dir") { WRAP.get(cur.path).classList.add("open"); ev.preventDefault(); return; }
  else if (ev.key === "ArrowLeft" && cur) {
    if (cur.type === "dir" && WRAP.get(cur.path).classList.contains("open")) WRAP.get(cur.path).classList.remove("open");
    else if (cur.parentPath) go(cur.parentPath);
    ev.preventDefault(); return;
  } else return;
  ev.preventDefault();
  if (rows[i]) go(rows[i].dataset.path);
});

/* Sash ridimensionabile */
(() => {
  const sash = document.getElementById("sash"), wb = document.getElementById("workbench");
  sash.addEventListener("mousedown", e => {
    e.preventDefault(); sash.classList.add("drag");
    const move = ev => wb.style.setProperty("--side-w", Math.min(600, Math.max(170, ev.clientX - 48)) + "px");
    const up = () => { sash.classList.remove("drag"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
})();

const START = "avvio-servizi";
const state = { tabs: ["", START], active: "" };
const tabsEl = document.getElementById("tabs");
const crumbsEl = document.getElementById("crumbs");
const contentEl = document.getElementById("content");

function go(path) {
  if (("#" + path) !== location.hash && !(path === "" && (location.hash === "" || location.hash === "#"))) {
    location.hash = path;           // hashchange → open()
  } else open(path);
}
addEventListener("hashchange", () => open(decodeURIComponent(location.hash.slice(1))));

function open(path) {
  if (path && path !== START && !BY_PATH.has(path)) path = "";
  if (!state.tabs.includes(path)) state.tabs.push(path);
  state.active = path;
  renderTabs();
  renderCrumbs(path);
  contentEl.innerHTML = path === START ? renderStart() : path ? renderNodePage(BY_PATH.get(path)) : renderOverview();
  contentEl.scrollTop = 0;
  if (path && path !== START) reveal(path); else treeEl.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  document.getElementById("title").textContent = (path === START ? "Avvio servizi — " : path ? BY_PATH.get(path).name + " — " : "") + "NetflixScout — Mappa del progetto";
}

function renderTabs() {
  tabsEl.innerHTML = state.tabs.map(p => {
    if (p === START) return `<div class="tab${p === state.active ? " on" : ""}" data-tab="${p}" title="Avvio dei servizi"><span class="ico"><span style="color:#89d185">▶</span></span><span>Avvio servizi</span><span class="x" data-close="${p}">✕</span></div>`;
    const n = p ? BY_PATH.get(p) : null;
    const ico = n ? (n.type === "dir" ? FOLDER_ICO : icon(n)) : `<span style="color:#3794ff">◈</span>`;
    const name = n ? n.name : "Panoramica";
    const cls = n && n.g ? ` style="color:var(--git-${n.g.toLowerCase()})"` : "";
    return `<div class="tab${p === state.active ? " on" : ""}" data-tab="${p}" title="${p || "Grafico della struttura"}">` +
      `<span class="ico">${ico}</span><span${cls}>${name}</span>` +
      (p ? `<span class="x" data-close="${p}">✕</span>` : `<span class="x" style="visibility:hidden"></span>`) + `</div>`;
  }).join("");
  const on = tabsEl.querySelector(".tab.on");
  if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
}
tabsEl.addEventListener("click", ev => {
  const close = ev.target.closest("[data-close]");
  if (close) {
    const p = close.dataset.close, i = state.tabs.indexOf(p);
    state.tabs.splice(i, 1);
    if (state.active === p) go(state.tabs[Math.max(0, i - 1)] || "");
    else renderTabs();
    return;
  }
  const t = ev.target.closest(".tab");
  if (t) go(t.dataset.tab);
});
tabsEl.addEventListener("auxclick", ev => {
  const t = ev.target.closest(".tab");
  if (ev.button === 1 && t && t.dataset.tab) t.querySelector("[data-close]").click();
});

function renderCrumbs(path) {
  if (path === START) { crumbsEl.innerHTML = `<a href="#">NetflixScout</a><span class="sep">›</span><span>Avvio servizi</span>`; return; }
  if (!path) { crumbsEl.innerHTML = `<a href="#">NetflixScout</a><span class="sep">›</span><span>Panoramica</span>`; return; }
  const parts = path.split("/");
  crumbsEl.innerHTML = `<a href="#">NetflixScout</a>` + parts.map((p, i) => {
    const sub = parts.slice(0, i + 1).join("/");
    return `<span class="sep">›</span>` + (i === parts.length - 1 ? `<span style="color:#ddd">${p}</span>` : `<a href="#${sub}">${p}</a>`);
  }).join("");
}

const strip = html => html.replace(/<[^>]+>/g, "");
function layerTag(L) {
  const l = LAYERS[L]; if (!l) return "";
  return `<span class="tag" style="color:${l.color};border-color:${l.color}55;background:${l.color}14">${l.label}</span>`;
}
function gitTag(n) {
  let t = "";
  if (n.g === "M") t += `<span class="tag" style="color:var(--git-m);border-color:#e2c08d55">M · modificato, non committato</span>`;
  if (n.g === "U") t += `<span class="tag" style="color:var(--git-u);border-color:#73c99155">U · nuovo, non tracciato</span>`;
  if (n.ig) t += `<span class="tag" style="color:#9a9a9a;border-color:#ffffff22">ignorato da git</span>`;
  return t;
}
function chip(p) {
  const n = BY_PATH.get(p);
  if (!n) return `<span class="chip ext">${p}</span>`;
  return `<a class="chip" href="#${p}" title="${strip(n.s || "").replace(/"/g, "&quot;")}"><span style="display:grid;place-items:center;width:14px">${n.type === "dir" ? FOLDER_ICO : icon(n)}</span>${p}</a>`;
}

function renderNodePage(n) {
  const isDir = n.type === "dir";
  const vs = `vscode://file${ROOT_ABS}/${n.path}`;
  let h = `<div class="page">
    <h1><span class="ico" style="display:grid;place-items:center">${isDir ? FOLDER_ICO : icon(n)}</span>${n.name}${isDir ? "/" : ""}</h1>
    <div class="path">${n.path}${isDir ? "/" : ""} ${n.name === ".env" ? "" : `<a class="vscode" href="${vs}">Apri in VS Code ↗</a>`}</div>
    <div class="tags">${layerTag(n.L)}${gitTag(n)}</div>
    <p class="lead">${n.s || ""}</p>`;

  if (n.d) h += `<h2>${isDir ? "Cosa contiene" : "Cosa fa"}</h2><p>${n.d}</p>`;
  if (n.it && n.it.length)
    h += `<h2>Elementi principali</h2><table class="items">${n.it.map(([k, v]) => `<tr><td><code>${k}</code></td><td>${v}</td></tr>`).join("")}</table>`;
  if (n.cmd) h += `<h2>Comando</h2><pre class="cmd">${n.cmd}</pre>`;

  if (isDir) {
    h += `<h2>Contenuto · ${n.children.length} elementi</h2>`;
    h += n.children.length
      ? `<div class="cards">${n.children.map(c => `<a class="card" href="#${c.path}"><span class="ico">${c.type === "dir" ? FOLDER_ICO : icon(c)}</span><div><b style="${c.g ? `color:var(--git-${c.g.toLowerCase()})` : c.ig ? "color:#8a8a8a" : ""}">${c.name}${c.type === "dir" ? "/" : ""}</b><span>${c.s || ""}</span></div></a>`).join("")}</div>`
      : `<p class="none">Cartella vuota.</p>`;
  } else {
    const deps = n.dep || [];
    h += `<h2>Dipende da</h2>` + (deps.length || (n.x && n.x.length)
      ? `<div class="chips">${deps.map(chip).join("")}${(n.x || []).map(x => `<span class="chip ext" title="Libreria esterna">📦 ${x}</span>`).join("")}</div>`
      : `<p class="none">Nessun modulo interno.</p>`);
    h += `<h2>Usato da</h2>` + (n.usedBy.length
      ? `<div class="chips">${n.usedBy.map(chip).join("")}</div>`
      : `<p class="none">Nessun modulo del progetto lo importa${n.L === "data" ? " (è un file di dati)" : ""}.</p>`);
  }
  if (n.n && n.n.length) h += `<h2>Da sapere</h2><div class="callout"><ul>${n.n.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  return h + `</div>`;
}

function renderDiagram() {
  const N = Object.fromEntries(NODES.map(n => [n.id, { h: 46, ...n }]));
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let edges = "", labels = "";
  for (const e of EDGES) {
    const a = N[e.f], b = N[e.t];
    const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    let pts;
    if (e.via) {
      pts = e.via;
    } else {
      const dir = e.dir || (Math.abs(bc.x - ac.x) > Math.abs(bc.y - ac.y) ? "h" : "v");
      if (dir === "h") {
        const s = [bc.x > ac.x ? a.x + a.w : a.x, ac.y], t = [bc.x > ac.x ? b.x : b.x + b.w, bc.y], mx = (s[0] + t[0]) / 2;
        pts = [s, [mx, s[1]], [mx, t[1]], t];
      } else {
        const sx = a.bar ? bc.x : ac.x;
        const s = [sx, bc.y > ac.y ? a.y + a.h : a.y], t = [bc.x, bc.y > ac.y ? b.y : b.y + b.h], my = (s[1] + t[1]) / 2;
        pts = [s, [s[0], my], [t[0], my], t];
      }
    }
    const d = "M" + pts.map(p => p.join(" ")).join(" L");
    edges += `<path d="${d}" fill="none" stroke="#8b949e" stroke-width="1.3" ${e.dash ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#ah)" ${e.both ? 'marker-start="url(#ah)"' : ""}/>`;
    if (e.l) {
      let lp = e.lp;
      if (!lp) {
        const i = Math.floor((pts.length - 1) / 2), p1 = pts[i], p2 = pts[i + 1];
        lp = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
      }
      const halo = lp[1] < 215 ? "#1a2322" : "#1c1f27";
      labels += `<text x="${lp[0]}" y="${lp[1] + 3.5}" text-anchor="middle" font-size="10" fill="#b8b8b8" paint-order="stroke" stroke="${halo}" stroke-width="5" stroke-linejoin="round">${esc(e.l)}</text>`;
    }
  }
  let nodes = "";
  for (const n of Object.values(N)) {
    const k = KIND[n.k], cx = n.x + n.w / 2;
    const dash = k.dash || (n.dash ? "4 3" : "");
    const attrs = `fill="${k.fill}" stroke="${k.stroke}" stroke-width="1.5" ${dash ? `stroke-dasharray="${dash}"` : ""}`;
    let shape, ty, sy;
    if (n.cyl) {
      const ry = 7;
      shape = `<path d="M${n.x} ${n.y + ry} a${n.w / 2} ${ry} 0 0 0 ${n.w} 0 v${n.h - 2 * ry} a${n.w / 2} ${ry} 0 0 1 ${-n.w} 0 z" ${attrs}/>` +
              `<ellipse cx="${cx}" cy="${n.y + ry}" rx="${n.w / 2}" ry="${ry}" ${attrs}/>`;
      ty = n.y + n.h / 2 + 6; sy = ty + 14;
    } else {
      shape = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" ${attrs}/>`;
      ty = n.s ? n.y + n.h / 2 - 3 : n.y + n.h / 2 + 4; sy = ty + 14;
    }
    const title = n.p ? `<title>${n.p} — clicca per la spiegazione</title>` : "";
    const api = n.api ? `<g><rect x="${n.x + n.w - 24}" y="${n.y - 7}" width="28" height="14" rx="7" fill="#c2732a"/><text x="${n.x + n.w - 10}" y="${n.y + 3}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">API</text></g>` : "";
    nodes += `<g class="${n.p ? "n" : ""}" ${n.p ? `data-path="${n.p}"` : ""}>${title}${shape}` +
      `<text x="${cx}" y="${ty}" text-anchor="middle" style="font-family:var(--mono)" font-size="${n.bar ? 11.5 : n.cyl ? 10.5 : 11}" font-weight="600" fill="#ececec">${esc(n.t)}</text>` +
      (n.s ? `<text x="${cx}" y="${sy}" text-anchor="middle" font-size="10" fill="#a9a9a9">${esc(n.s)}</text>` : "") + api + `</g>`;
  }
  return `<svg viewBox="0 0 1000 1296" role="img" aria-label="Architettura di NetflixScout" style="font-family:var(--sans)">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
    <rect x="8" y="8" width="984" height="200" rx="10" fill="#1a2322" stroke="#2bb3a033"/>
    <text x="24" y="31" font-size="11" font-weight="700" letter-spacing=".06em" fill="#2bb3a0">① INDICIZZAZIONE OFFLINE</text>
    <text x="210" y="31" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">python buildSemanticDb.py --embedding-backend openai|local</text>
    <rect x="8" y="222" width="984" height="410" rx="10" fill="#1c1f27" stroke="#4a9eff33"/>
    <text x="24" y="245" font-size="11" font-weight="700" letter-spacing=".06em" fill="#4a9eff">② RUNTIME</text>
    <text x="110" y="245" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">python app.py</text>
    <rect x="8" y="648" width="984" height="116" rx="10" fill="#241c1a" stroke="#f78c6c33"/>
    <text x="24" y="671" font-size="11" font-weight="700" letter-spacing=".06em" fill="#f78c6c">③ TOOL DB MOVIELENS</text>
    <text x="466" y="671" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">python buildMovieDb.py (offline, una volta)</text>
    <rect x="8" y="778" width="984" height="116" rx="10" fill="#1e2419" stroke="#c3e88d33"/>
    <text x="24" y="801" font-size="11" font-weight="700" letter-spacing=".06em" fill="#c3e88d">④ TOOL TMDB</text>
    <text x="366" y="801" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">dati live · max_calls_per_turn = 6 · nessun retry</text>
    <rect x="8" y="908" width="984" height="116" rx="10" fill="#26221a" stroke="#ffcb6b33"/>
    <text x="24" y="931" font-size="11" font-weight="700" letter-spacing=".06em" fill="#ffcb6b">⑤ TOOL YOUTUBE</text>
    <text x="366" y="931" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">max 2 ricerche per turno · 100 search.list al giorno · nessuna cache</text>
    <rect x="8" y="1038" width="984" height="116" rx="10" fill="#18232a" stroke="#89ddff33"/>
    <text x="24" y="1061" font-size="11" font-weight="700" letter-spacing=".06em" fill="#89ddff">⑥ TOOL WIKIPEDIA</text>
    <text x="366" y="1061" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">nessuna chiave · inglese di default · articolo a sezioni · follow_up</text>
    <rect x="8" y="1168" width="984" height="124" rx="10" fill="#27191b" stroke="#e06c7533"/>
    <text x="24" y="1191" font-size="11" font-weight="700" letter-spacing=".06em" fill="#e06c75">⑦ SERVER WEB</text>
    <text x="210" y="1191" font-size="11" fill="#8b8b8b" style="font-family:var(--mono)">uvicorn web_api.main:app · 1 worker · il runner chiama app.handle_query</text>
    ${edges}${nodes}${labels}
  </svg>`;
}

function renderOverview() {
  const L = (k, label) => `<span><i style="background:${KIND[k].fill};border-color:${KIND[k].stroke}${KIND[k].dash ? ";border-style:dashed" : ""}"></i>${label}</span>`;
  return `<div class="page" style="max-width:1120px">
    <h1><span style="color:#3794ff">◈</span>NetflixScout</h1>
    <div class="path">Mappa del progetto · grafico della struttura</div>
    <p class="lead">Assistente da terminale e da web (server FastAPI/SSE) che consiglia film con una pipeline RAG sul CMU Movie Summary Corpus (Qdrant per la ricerca, Cohere per il rerank, OpenAI per classificazione, segnali, embedding e risposta) risponde a domande su voti e classifiche con un database SQLite read-only di MovieLens 32M e recupera dati aggiornati (cast, regia, streaming, trailer, trending, serie) dall'API di TMDb e video su un film (interviste a regista e cast, making-of, dietro le quinte, commenti degli autori) dalla YouTube Data API; per informazioni enciclopediche (biografie, storia e produzione di un film, antologie, confronti con l'opera d'origine) legge Wikipedia a sezioni. Ogni tool vive in <code>tool/</code>; il database MovieLens resta in <code>movie_db/</code>.</p>
    <p style="color:var(--muted)">Clicca un riquadro del grafico, oppure un file o una cartella nell'explorer a sinistra, per leggerne la spiegazione.</p>
    <div class="diagram" id="diagram">${renderDiagram()}</div>
    <div class="legend">
      ${L("off", "Indicizzazione offline")}${L("rt", "Runtime RAG")}${L("orch", "Orchestrazione / guardrail")}${L("out", "Output / presenter")}${L("db", "Tool DB MovieLens")}${L("tmdb", "Tool TMDb")}${L("youtube", "Tool YouTube")}${L("wikipedia", "Tool Wikipedia")}${L("web", "Server web / liste")}${L("entry", "Entry point")}${L("data", "Dati locali")}${L("ext", "Esterno / non è un file")}
      <span><i style="background:#c2732a;border-color:#c2732a;border-radius:7px"></i>chiama un'API a pagamento</span>
    </div>

    <h2>Il flusso in 12 passi</h2>
    <ol class="steps">
      <li><b>Indicizzazione (una volta sola).</b> <a class="vscode" href="#buildSemanticDb.py">buildSemanticDb.py</a> legge <code>dataset/</code>. Ogni trama diventa un chunk con titolo, anno, generi e cast; gli embedding finiscono in Qdrant (collection <code>netflix_scout</code>).</li>
      <li><b>Guardrail.</b> <a class="vscode" href="#app.py">app.py</a> riceve la domanda e <a class="vscode" href="#${Q}query_classifier/query_classifier.py">query_classifier</a> (gpt-4o-mini) blocca quelle che non riguardano il cinema, rispondendo con una riga secca nella lingua dell'utente (la scrive il classificatore stesso, qualunque lingua; ripiego fisso it/en) e senza mostrare stadi, storia o riquadro. Vede anche l'ultimo scambio della conversazione (<code>classifier_context_messages = 2</code>), così un follow-up come “ne puoi trovare 3 più recenti?” non viene scambiato per off-topic; giudica comunque solo l'ultima domanda. Considera cinematografiche anche le domande statistiche su voti, classifiche e generi.</li>
      <li><b>Orchestrazione.</b> <a class="vscode" href="#orchestrator.py">orchestrator.py</a>, con una chiamata LLM, riscrive le domande di follow-up in una query autonoma usando la history (“e uno più recente?” → “film di fantascienza con robot più recenti”) e sceglie il tool: <code>rag_search</code> per trama, temi, generi, interpretazione e raccomandazioni (è anche il fallback), <code>movie_db_search</code> per classifiche, voti medi, numero di voti, generi per anno e tag, <code>tmdb_search</code> per dati fattuali e aggiornati (chi ha diretto, chi recita, streaming, trailer, trending, serie), <code>youtube_search</code> per interviste e making-of, <code>wikipedia_search</code> per le informazioni enciclopediche. Una regola di copertura dei dati manda a <code>tmdb_search</code> i film più recenti di ciò che RAG (fino al 2012) e MovieLens (fino al 2022) contengono. Il prompt contiene il catalogo dei tool con i loro schemi. La query autonoma vale per qualunque tool. Una richiesta composta (per esempio un film e un'intervista) elenca le sue parti e i tool le eseguono in sequenza nello stesso turno, ognuno con i dati dei precedenti, fino a <code>max_tool_calls_per_turn</code>.</li>
      <li><b>Retrieval.</b> <a class="vscode" href="#${Q}retrieval.py">retrieval.py</a> estrae i segnali in inglese dalla query (cosa vuoi, cosa evitare, cosa escludere, la frase da embeddare <code>semantic_query</code> e i generi), fa l'embedding di <code>semantic_query</code>, dà un boost (<code>genre_boost = 0.15</code>) ai film del genere richiesto su un pool di <code>fetch_k = 50</code> e tiene fino a <code>k_largo = 10</code> candidati, in modalità <code>semantic</code>, <code>bm25</code> o <code>hybrid</code> (l'indice BM25 è letto a pagine e tenuto in cache). Il planner sceglie solo <code>k_finale</code>, cioè quanti film chiede l'utente (<a class="vscode" href="#${Q}retrieval_params.py">retrieval_params.py</a>).</li>
      <li><b>Rerank.</b> <a class="vscode" href="#${Q}rerank.py">rerank.py</a> riordina con Cohere <code>rerank-v3.5</code>, mostrandogli titolo, anno e generi prima della trama, e tiene i primi <code>k_finale</code> (3 per default). Poi <a class="vscode" href="#${T}enrich.py">tmdb/enrich.py</a> completa i film scelti con metadati TMDb, solo se titolo e anno coincidono.</li>
      <li><b>Tool DB.</b> <a class="vscode" href="#${MT}movie_db_tool.py">movie_db_tool.py</a> fa convertire la domanda dal <a class="vscode" href="#${MT}parser.py">parser</a> in un'operazione whitelistata (<code>MovieDbQuery</code>, mai SQL), e <a class="vscode" href="#${MT}sql">tool/sql/</a> la esegue con SQL fisso e parametri bind su <code>movie_db/data/movielens32m.sqlite3</code>, aperto in sola lettura (<code>mode=ro</code>, <code>query_only</code>, authorizer). Le righe diventano chunk per la risposta; la trace contiene solo le query eseguite.</li>
      <li><b>Tool TMDb.</b> <a class="vscode" href="#${T}tool.py">tmdb/tool.py</a> valida le <code>requests</code> del planner (<a class="vscode" href="#${T}models/requests.py">TmdbToolInput</a>, 1–4 operazioni tra 17) prima di qualunque chiamata, risolve gli ID mancanti e chiama endpoint fissi tramite <a class="vscode" href="#${T}http.py">http.py</a>, l'unico punto di I/O: memo del turno, cache TTL, pausa dopo un 429 e al massimo <code>max_calls_per_turn = 6</code> tentativi, senza retry. <a class="vscode" href="#${T}prompt_budget.py">prompt_budget.py</a> limita i dati passati all'LLM.</li>
      <li><b>Tool YouTube.</b> <a class="vscode" href="#${Y}tool.py">youtube/tool.py</a> valida l'input del planner (<a class="vscode" href="#${Y}models.py">YoutubeToolInput</a>), fa una <code>search.list</code> per categoria con query composte da <a class="vscode" href="#${Y}queries.py">queries.py</a> (al massimo 2 per turno), una sola <code>videos.list</code> tramite <a class="vscode" href="#${Y}http.py">http.py</a> e filtra i risultati con <a class="vscode" href="#${Y}relevance.py">relevance.py</a> sui dati completi, senza riordinarli: i video incerti restano “da verificare”.</li>
      <li><b>Tool Wikipedia.</b> <a class="vscode" href="#${W}tool.py">wikipedia/tool.py</a> interroga <b>una sola edizione</b> (inglese per default; l'italiano solo se il planner lo chiede in un passo successivo): <a class="vscode" href="#${W}queries.py">queries.py</a> compone la ricerca o la richiesta dell'articolo intero, <a class="vscode" href="#${W}http.py">http.py</a> è l'unico punto di I/O (memo, cache, pausa su 429 e <code>maxlag</code>, budget di turno) e <a class="vscode" href="#${W}sections.py">sections.py</a> divide l'articolo per intestazioni e consegna le sezioni che servono alla domanda fino al budget di contesto. Il tool non decide se basta: offre <code>follow_up</code> (cosa è stato letto e cosa no) e giudica il planner con un passo in più.</li>
      <li><b>Risposta.</b> L'orchestratore scrive la risposta usando solo i dati ricevuti, con le regole del tool usato (<code>tool_final_instructions</code>), in UNA chiamata in streaming: il testo arriva al canale mentre viene scritto. Ogni 12 messaggi <a class="vscode" href="#${Q}conversation.py">conversation.py</a> compatta la history.</li>
      <li><b>Output.</b> <code>handle_query</code> in <a class="vscode" href="#app.py">app.py</a> non stampa nulla: impacchetta risposta e passaggi in un <a class="vscode" href="#turn.py">TurnResult</a>. Poi <a class="vscode" href="#presenters">presenters/</a> lo mostra in base al canale dichiarato dall'entry point: a terminale il procedimento viene raccontato <b>mentre accade</b>, perché l'orchestratore emette gli step a un <code>TurnObserver</code>: poche frasi semplici (“⏳ Cerco su TMDb: …”, “✅ TMDb: trovato, 2 s”, “⚠️ nessun risultato”, fallback e parti non cercate) seguite dal blocco di dettaglio del tool (K LARGO e RERANKING, oppure 🗄️ QUERY DB con il SQL eseguito, 🎞️ CHIAMATE TMDB con gli URL mascherati e l'attribuzione JustWatch, ▶️ YOUTUBE, 📖 WIKIPEDIA con pagine, licenza e link), poi la risposta, stampata a pezzi mentre arriva; il web restituisce la stessa storia e gli stessi dati in JSON (<code>to_payload</code>) e, dal vivo, come eventi (<a class="vscode" href="#presenters/web/observer.py">WebObserver</a>), costruiti dalle stesse viste condivise.</li>
      <li><b>Server web.</b> <a class="vscode" href="#web_api/server.py">web_api/</a> espone il bot al frontend: <code>POST /conversations/{id}/messages</code> risponde con uno stream SSE (<code>turn_start</code>, <code>status</code>, <code>story</code>, <code>step</code>, <code>answer_delta</code>, <code>answer_end</code>, <code>lists</code>, <code>done</code>). Il turno gira in un thread di proprietà del server (<a class="vscode" href="#web_api/streaming/runner.py">runner.py</a>): la history si registra quando <code>handle_query</code> ritorna anche se il client è sparito. La stessa chiamata della risposta restituisce anche i riferimenti alle liste, che <a class="vscode" href="#web_lists/attach_lists.py">web_lists/</a> controlla e idrata con i dati dei tool, senza altre chiamate.</li>
    </ol>

    <h2>Punti di attenzione nel codice</h2>
    <div class="callout"><ul>
      <li>Il commit “migrate db to Qdrant” (2026-10-03) non conteneva codice Qdrant; la migrazione è stata poi fatta: Qdrant è l'unico motore: ChromaDB è stato rimosso.</li>
      <li>MovieLens: serie TV escluse dalle classifiche tramite TMDb <code>/find</code> per IMDb id, titoli normalizzati in lettura e <code>by_title</code> a livelli (esatto, normalizzato, sottostringa), verificati offline con transport finto. Non ancora verificato live: la risposta reale di <code>/find</code> sui dati MovieLens. Resta il limite che una ricerca parziale come «The Kingdom» non trova il titolo archiviato con l'articolo in fondo («Kingdom II, The (Riget II)»).</li>
      <li>Verifiche reali del 2026-10-22 (app, TMDb, OpenAI e Cohere reali, ≥30 s tra gli invii): routing live 23/23; titoli alternativi e varianti verificati su dati TMDb reali; A/B controllato del reranker (36 chiamate Cohere): violazioni verificabili 20 con la query italiana, 21 con la sola semantica, 16 con la query composta. Il 2026-10-26 <code>demote_contradicted</code> (dopo Cohere, i film contraddetti dai metadati di genere o decennio passano dopo gli altri) ha dato, su 5 casi e lo stesso pool, 4→3 violazioni nei top 3 con tutte e tre le query (15 chiamate Cohere): corregge il caso 12, non il 20, perché nei 10 candidati nessun film rispetta genere e decennio (limite del pool, non del reranker). Campione piccolo, metrica uguale al criterio del riordino.</li>
      <li>Tool YouTube: E2E reale del 2026-10-23 (20 domande, prima dei fix di pertinenza) con routing 20/20 e 6 OK / 10 parziali / 4 falliti. Lo smoke test è stato lanciato il 2026-10-27 (7 ricerche) e ha mostrato che la query con la persona come alternativa dava 0 risultati per «Critters 3»: ora per le interviste la persona è in AND (1 ricerca di conferma: 9 risultati pertinenti al film ma nessuna intervista confermata). Ancora da verificare live: l'E2E dopo i fix, i casi YouTube nel routing eval, la precedenza generale degli operatori (provata solo per questa forma), l'effetto della nuova query sulle interviste dei film popolari con titolo di più parole e il rispetto reale delle istruzioni da parte dell'LLM. Le Developer Policies (III.A.2) chiedono anche una privacy policy dell'applicazione, non ancora scritta.</li>
      <li><b>Verifica live del 2026-10-27</b> (33 chiamate: 1 ricerca YouTube, 26 al classificatore, 6 al planner). Stato di ogni punto:
        <ul>
          <li><b>Risolto e verificato.</b> Classificatore: i 4 casi che fallivano (streaming di Interstellar, formazione, doppiaggio, Solaris) ora 12/12 su 3 prove. YouTube: la query per «Critters 3» con DiCaprio non restituisce più 0 risultati (9, tutti su quel film). Test offline: i 4 test che contavano i moduli falliti per le copie «… 2» passano dopo la loro rimozione (52 sorgenti tracciate in <code>tool/tmdb</code> e <code>tool/youtube</code>, versioni vecchie degli originali; altri 165 <code>.pyc</code> non tracciati).</li>
          <li><b>Parzialmente verificato.</b> Filtri del classificatore: 8 controlli off-topic e jailbreak su 8 bloccati, ma una sola prova ciascuno. YouTube: i risultati sono pertinenti al film, ma nessuna è un'intervista confermata (probabile limite dei dati) e l'effetto della nuova query (persona in AND) sui film popolari con titolo di più parole non è misurato. Routing: «plot in English» (Wikipedia) e Tom Hanks (<code>movie_details</code>/<code>search</code>) 2/2 sulle prove, Truman Burbank 1/2. La nota sul campo <code>title</code> di <code>movie_details</code> (mai il nome di un personaggio) è aggiunta e coperta da test offline, ma non provata sul modello reale.</li>
          <li><b>Ancora aperto.</b> Horror 2020 intermittente (a volte <code>rag_search</code>); Tom Hanks con <code>person_details</code> non accettato dall'attesa; Truman Burbank con il nome del personaggio come titolo in <code>movie_details</code> (1 prova su 2 prima della nota); precedenza generale degli operatori di <code>q</code> non confermata (provata solo per la forma senza ancoraggio AND con le esclusioni); il routing eval completo dopo il cambio di schema non è stato rieseguito (52/60 prima delle correzioni).</li>
        </ul>
      </li>
      <li>Tool Wikipedia: tutti i test sono offline. Mai eseguiti: lo smoke test live, il routing eval live dei casi Wikipedia e un E2E con LLM reale (rispetto delle istruzioni sugli estratti, qualità del giudizio di sufficienza del planner, taratura di <code>context_chars_per_turn</code>). Le regole sulle affermazioni non supportate (titoli originali, traduzioni, identificazioni) sono istruzioni per il modello: non dimostrabili offline.</li>
      <li>Server web: nessuna autenticazione né rate limit, per scelta; un solo worker (conversazioni in memoria). Lo streaming strutturato (<code>answer</code> prima di <code>lists</code>) non è dimostrato sul modello reale: lo controlla <code>web_api/harness/live_stream_check.py</code> (1 chiamata, con permesso). La selezione dei riferimenti delle liste non comprende la semantica: scarta solo per segnali di negazione o confronto.</li>
      <li>Termini TMDb: l'attribuzione JustWatch è implementata; §1.C vieta l'uso con applicazioni AI, scelta consapevole del proprietario per un uso personale da portfolio.</li>
    </ul></div>
  </div>`;
}
